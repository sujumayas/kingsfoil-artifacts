<!--FIG stack-->
<figure class="fig" data-demo="stack" id="fig-26">
  <div class="fig-h"><span class="fig-n">Fig. 26</span><h4 class="fig-t">The layered architecture, top to bottom</h4><span class="illu">Design proposal [I]</span></div>
  <div class="stack">
    <div class="layers">
      <button type="button" class="layer srv" data-l="L-weather"><b>0</b><span>Weather state<small>server-authoritative, synced</small></span></button>
      <div class="layer-arrow">▼</div>
      <button type="button" class="layer" data-l="L-data"><b>1</b><span>Data layer<small>per visible chunk, client</small></span></button>
      <button type="button" class="layer srv" data-l="L-game"><b>1′</b><span>Gameplay layer<small>server: tile band and wear</small></span></button>
      <div class="layer-arrow">▼</div>
      <button type="button" class="layer" data-l="L-update"><b>2</b><span>Update layer<small>choose one per platform</small></span></button>
      <div class="layer-arrow">▼</div>
      <button type="button" class="layer" data-l="L-render"><b>3</b><span>Render layer<small>one CanvasItem shader</small></span></button>
      <div class="layer-arrow">▼</div>
      <button type="button" class="layer" data-l="L-flakes"><b>4</b><span>Flakes layer<small>z-flakes + hashed far layers</small></span></button>
    </div>
    <div class="ldet" aria-live="polite"></div>
  </div>
  <template id="L-weather"><h4>Weather state</h4><p>Server-authoritative and synced: intensity 0..1, temperature °C, wind (bucketed), sun factor, time and an RNG seed.</p><p>Multiplayer sync carries only this state plus seeds. Precedents: Don't Starve Together's single <code>precipitation</code> scalar and Vav Labs' depth map read by both renderer and gameplay.</p></template>
  <template id="L-data"><h4>Data layer</h4><ul><li><code>depth</code> R8 (u8 per art pixel or 2×2)</li><li><code>packed</code> R8 (trail mark)</li><li><code>wet</code> R8 (meltwater / ice flag)</li><li><code>expo</code> R8 baked: shelter × wind lee (B5, B6)</li><li><code>sun</code> R8 baked: day-summed shadow (D3)</li></ul><p>Or one RGBA8 texture (depth, packed, wet, exposure) that uploads without a copy, as in Sandspiel. Compatibility means RGBA8 precision and no 2D HDR, so use stochastic rounding. <code>DrawableTexture2D</code> has no R8 format; pack channels with <code>modulate</code> masks.</p></template>
  <template id="L-game"><h4>Gameplay layer (server)</h4><ul><li>tile snow band 0..3 (B2)</li><li>tile wear 0..255 (C6)</li><li>→ speed multiplier, tracking</li></ul><p>Speed comes from the server's tile band (C4). The server can store sparse "track events" (who, where, when) and let clients render them. Footprints, flakes and per-pixel melt stay local and cosmetic.</p></template>
  <template id="L-update"><h4>Update layer</h4><ol><li><b>CPU</b>: GDScript at 5–10 Hz, stochastic picks on Noita-style dirty 64×64 chunks → <code>Image</code> → <code>ImageTexture.update()</code>, uploading only dirty chunks.</li><li><b>Shader ping-pong</b>: two SubViewports or a DrawableTexture2D pair with pull-form rules, since there is no compute on web.</li><li><b>Hybrid</b>: DrawableTexture2D stamps for cosmetic trails (<code>blit_rect</code> ADD/SUB), CPU field for the rest. Wrap the experimental API in one script.</li></ol></template>
  <template id="L-render"><h4>Render layer</h4><p>One nearest-filtered CanvasItem shader on the ground: <code>depth &gt; threshold(Bayer + hash)</code> → emboss band → palette index → palette LUT (day/night, lamp). It combines B4 + E2 threshold, E3 emboss, E1/E4 palette and E5 sparkle.</p></template>
  <template id="L-flakes"><h4>Flakes layer</h4><p>50–150 z-flakes with shadow dots for the near layer (CPU or MultiMesh), plus 2 cheap hashed far layers. There is no particle collision on web, so landing is computed by hand.</p></template>
  <figcaption>Click a layer to see what it holds. Everything here is a design proposal grounded in the cited sources; none of it has been tested in Godot.</figcaption>
</figure>
<!--/FIG-->
