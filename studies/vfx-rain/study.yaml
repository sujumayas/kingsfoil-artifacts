# Study config — read by studykit and by the recipe (build.py) via studykit.ctx(__file__).
id: vfx-rain   # must match the item id in site/catalog.json (title, tags, series live there)
kind: recipe                    # recipe = page is generated by build.py; static = site/<page> is the source
page: vfx-rain-topdown-pixel.html
report: report.md               # the markdown research report (source of truth for the text)
sandbox:
  page: vfx-rain-sandbox.html
  source: sandbox.html          # hand-written single-file sandbox, copied verbatim to site/
thumb:                          # homepage card: native-resolution grab of the sandbox canvas
  from: sandbox
  canvas: '#c'
  steps: [{click: 'button[data-w="heavy"]'}, {wait: 9000}]
qa:
  max_page_kb: 900              # page-weight budget checked by the validator
