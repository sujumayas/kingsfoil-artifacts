<!--FIG doom-->
<figure class="fig" data-demo="doom" id="fig-doom">

      <p class="pl">Each hit adds to a pixel's <b>wetness byte</b>; sampled drying subtracts. A pixel shows its wet palette row once <code>wet &gt; 4 + 9·Bayer + 40·hash</code>. The pond runs <code>new = (N+S+E+W)/2 − old</code>, ×0.95.</p></div>
  </div>

<!--FIG ways-->
<figure class="fig" data-demo="ways" id="fig-ways">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Four ways to draw falling rain, and what each costs per frame</h4><span class="illu">Scaled to a 112×64 view</span></div>
  <div class="quad">
    <div><div class="stage"><canvas width="112" height="64" aria-label="A1: one pre-drawn rain sheet blended at 50 percent and jumped every 4 frames"></canvas><span class="tagl">A1 overlay sheet</span><div class="hud" data-hud="a"></div></div></div>
    <div><div class="stage"><canvas width="112" height="64" aria-label="A2: landing-first sprite drops that always splash where they were aimed"></canvas><span class="tagl">A2 landing-first sprites</span><div class="hud" data-hud="b"></div></div></div>
    <div><div class="stage"><canvas width="112" height="64" aria-label="A3: streaks with a z-height and wind slant, three depth layers"></canvas><span class="tagl">A3 z-height streaks</span><div class="hud" data-hud="c"></div></div></div>
    <div><div class="stage"><canvas width="112" height="64" aria-label="A4: hashed-cell shader layers computed per pixel"></canvas><span class="tagl">A4 hashed cells</span><div class="hud" data-hud="d"></div></div></div>
  </div>
  <div class="ctl">
    <div class="seg" data-seg="tier" role="group" aria-label="Rain tier"><button type="button" data-v="0">Drizzle</button><button type="button" data-v="1">Light</button><button type="button" class="on" data-v="2">Moderate</button><button type="button" data-v="3">Heavy</button><button type="button" data-v="4">Storm</button></div>
    <label class="rng">Wind <input type="range" data-k="wind" min="-100" max="100" value="30"><output data-o="wind"></output></label>
    <label><input type="checkbox" data-k="pan"> Pan the camera</label>
    <label><input type="checkbox" data-k="land"> Show A2 landing cells</label>
  </div>
  <figcaption><b>A1</b> is ALttP's trick: one sheet, blended at 50 %, jumping between four offsets every 4 frames (15 Hz) and scrolling at ½ camera speed <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s13">S13</a></span>. It ignores everything below it. <b>A2</b> is Emerald's: pick the landing cell first, start the sprite at <code>land − velocity × fallFrames</code>, and the splash lands exactly there, with 10 / 16 / 24 sprites for rain, storm and downpour <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s5">S5</a></span>. <b>A3</b> is the Sandbox's: a ground point plus a height <code>z</code>, three layers, a wind slant and a splash by surface. <b>A4</b> hashes screen cells in three depth layers. The counters show the cost model: A1 and A4 cost the same at any intensity; A2 is capped; A3 grows with the drop count. Drop counts and speeds are scaled to this small view (illustrative).</figcaption>
</figure>
<!--/FIG-->
<!--FIG cost-->
<figure class="fig" data-demo="cost" id="fig-cost">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Reported costs against one 60 Hz frame</h4><span class="illu">Different machines; not a benchmark</span></div>

    <div class="seg" data-seg="scale" role="group" aria-label="Axis scale"><button type="button" class="on" data-v="log">Log scale</button><button type="button" data-v="lin">Linear scale</button></div>
    <span class="mute" style="font-size:13px">Tick bars to stack them into one frame:</span>
  </div>
  <svg class="chart costc" role="img" aria-label="Horizontal bar chart of reported rain costs in milliseconds"></svg>
  <div class="readout" aria-live="polite" data-ro></div>
  <figcaption>The 16.7 ms line is simply one frame at 60 Hz. ToyShop's full-screen rain layer took 4.11 ms against 19.45 ms for 5–10K CPU particles <span class="cite"><b class="tag tv">V</b> vendor, <a class="sref" href="#s58">S58</a></span>; Remember Me's four layers cost ~1.7 ms "the same whatever the strength" <span class="cite"><b class="tag tv">V</b> vendor, <a class="sref" href="#s59">S59</a></span>. Every figure comes from a different machine and year, so the stacked total is only a way to see proportions: <b>layers are flat, particles scale</b>.</figcaption>
</figure>
<!--/FIG-->
<!--FIG curtain-->
<figure class="fig" data-demo="curtain" id="fig-curtain">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Rain curtains: drop density times a slow noise that drifts with the wind</h4></div>
  <div class="stage"><canvas width="160" height="90" aria-label="Rain spawned through a scrolling noise mask so sheets of heavier rain sweep across"></canvas><div class="hud" data-hud></div></div>
  <div class="ctl">
    <div class="seg" data-seg="view" role="group" aria-label="View"><button type="button" class="on" data-v="rain">Rain</button><button type="button" data-v="mask">Curtain mask</button><button type="button" data-v="wet">Wetness it leaves</button></div>
    <label class="rng">Wind <input type="range" data-k="wind" min="-100" max="100" value="45"><output data-o="wind"></output></label>
    <label><input type="checkbox" data-k="on" checked> Curtains on</label>
  </div>
  <div class="readout" aria-live="polite" data-ro></div>
  <figcaption>The Sandbox's field is <code>curtain = 0.45 + 0.75·vnoise((x − 42·wind·t)/46, y/38 + 0.04·t)</code>; each drop is spawned by rejection against it (up to four tries), and background wetting reads it too <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s4">S4</a></span>. Switch curtains off and the same drops fall uniformly: texture, not weather. The cost is one noise lookup per spawn.</figcaption>
</figure>
<!--/FIG-->
<!--FIG shadow-->
<figure class="fig" data-demo="shadow" id="fig-shadow">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Cover map and rain shadow: paint walls, roofs and trees, then turn the wind</h4></div>

  <div class="ctl">
    <div class="seg" data-seg="tool" role="group" aria-label="Paint tool"><button type="button" class="on" data-v="wall">Wall (h 9)</button><button type="button" data-v="house">Roof (h 30)</button><button type="button" data-v="tree">Tree canopy</button><button type="button" data-v="erase">Erase</button></div>
    <div class="seg" data-seg="view" role="group" aria-label="View"><button type="button" class="on" data-v="rain">Rain</button><button type="button" data-v="exp">Exposure X-ray</button></div>
    <label class="rng">Wind <input type="range" data-k="wind" min="-100" max="100" value="60"><output data-o="wind"></output></label>
    <button type="button" class="btn" data-b="reset">Reset</button>
  </div>
  <div class="readout" aria-live="polite" data-ro></div>
  <figcaption>Drag on the canvas to paint. Roofs block rain completely (cover 0); trees use the Sandbox's canopy shelter <code>0.1 + 0.9·r²</code>. Downwind, each ground cell walks upwind up to 26 px; the first obstacle of height <code>h</code> gives a lee <code>L = 0.9·h·|wind| + 1.5</code>, and the cell's exposure is multiplied by <code>0.08 + 0.92·(d/L)²</code> <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s4">S4</a></span>. It is rebuilt only when <code>round(3·wind)</code> changes, so it costs nothing per frame. The same map gates drops, splashes, wetting and soaking (E1).</figcaption>
</figure>
<!--/FIG-->
<!--FIG dither-->
<figure class="fig" data-demo="dither" id="fig-dither">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">The wetness byte through a dither threshold</h4></div>
  <div class="bayer-wrap">
    <div><div class="stage"><canvas width="96" height="64" aria-label="Ground tile wetting in speckles through per-pixel thresholds"></canvas><div class="hud" data-hud></div></div></div>
    <div>
      <div class="bgrid" aria-label="4 by 4 Bayer matrix; cells light up when the average wetness passes their share of the threshold"></div>
      <p class="pl mute" style="font-size:13px;margin:8px 0 0">The 4×4 Bayer cells that the average wetness has passed light up blue. The <code>40·hash</code> term then shuffles neighbours so the grid does not show.</p>
    </div>
  </div>
  <div class="ctl">
    <div class="seg" data-seg="mat" role="group" aria-label="Material"><button type="button" class="on" data-v="1">Dirt</button><button type="button" data-v="0">Grass</button><button type="button" data-v="2">Stone</button><button type="button" data-v="3">Sand</button><button type="button" data-v="8">Cloth</button><button type="button" data-v="9">Metal</button></div>
    <div class="seg" data-seg="wx" role="group" aria-label="Weather"><button type="button" class="on" data-v="rain">Raining</button><button type="button" data-v="sun">Sun</button><button type="button" data-v="shade">Sun, shaded</button></div>
    <label class="rng">Intensity <input type="range" data-k="int" min="2" max="100" value="30"><output data-o="int"></output></label>
    <div class="seg" data-seg="thr" role="group" aria-label="Threshold"><button type="button" class="on" data-v="bh">Bayer + hash</button><button type="button" data-v="b">Bayer only</button><button type="button" data-v="f">Flat</button></div>
  </div>
  <div class="readout" aria-live="polite" data-ro></div>
  <figcaption>The Sandbox threshold is <code>thr = 4 + 9·Bayer + 40·hash</code>; a drawn drop adds +36 and each virtual drop +26, while drying samples pixels and removes 3 with probability <code>DRY[m]·factor·0.5</code> <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s4">S4</a></span>. At drizzle (switch material to restart from dry) the ground speckles; leave it running and it still soaks, because the Sandbox has no per-tier ceiling <span class="cite"><b class="tag ti">I</b> Sandbox run</span>. Switch to Sun and the picture runs backwards. "Bayer only" reads as a grid, which is why the hash term exists.</figcaption>
</figure>
<!--/FIG-->
<!--FIG porosity-->
<figure class="fig" data-demo="porosity" id="fig-porosity">

  <div class="ctl">

  </div>

</figure>
<!--/FIG-->

<figure class="fig" data-demo="drying" id="fig-drying">

  <div class="ctl" style="margin-top:0">
    <div class="seg" data-seg="sun" role="group" aria-label="Exposure"><button type="button" class="on" data-v="sun">Sun, exposed</button><button type="button" data-v="shade">Sun, shaded</button></div>
    <label class="rng">Time <input type="range" data-k="t" min="0" max="120" value="15"><output data-o="t"></output></label>
  </div>
  <svg class="chart dryc" role="img" aria-label="Fraction of pixels still looking wet over time, one S-curve per material"></svg>

  <div class="chips" data-mats role="group" aria-label="Materials shown"></div>
  <figcaption>Each curve replays the Sandbox's rule on 600 pixels per material: every step, 5,000 samples per 57,600 pixels each lose 3 wetness with probability <code>DRY[m]·factor·0.5</code>, with the factor ×2.6 in sun and ×0.45 of that in shade <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s4">S4</a></span>. Because every pixel has its own threshold, the fraction that still <i>looks</i> wet falls as an S-curve, as Lagarde describes <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s62">S62</a></span>. The dashed curve is the shine (<code>WET &gt; 200</code>), which goes first. Rings mark the measured 50 % / 90 % times from §6e <span class="cite"><b class="tag ti">I</b> Sandbox run</span>; the full Sandbox also has puddles and borders, so the replay is close but not identical.</figcaption>
</figure>
<!--/FIG-->
<!--FIG puddles-->
<figure class="fig" data-demo="puddles" id="fig-puddles">

    <label class="rng">Wind <input type="range" data-k="u" min="0" max="10" step=".5" value="5"><output data-o="u"></output></label>
    <div class="seg" data-seg="drop" role="group" aria-label="Drop"><button type="button" data-v="2">Drizzle (~2 m/s)</button><button type="button" class="on" data-v="6.4">2 mm drop</button><button type="button" data-v="9.5">5 mm drop (~9–10 m/s)</button></div>
    <label class="rng">Exposure <input type="range" data-k="exp" min="4" max="33" value="17"><output data-o="exp"></output></label>
    <label class="rng">Wall <input type="range" data-k="h" min="1" max="6" step=".5" value="3"><output data-o="h"></output></label>
    <label><input type="checkbox" data-k="snap" checked> Snap to clean slopes</label>
  </div>
  <figcaption><code>tan θ = u/v</code> <span class="cite"><b class="tag tk">K</b></span>: a 2 mm drop leans 9° / 25° / 38° / 57° in 1 / 3 / 5 / 10 m/s wind, and drizzle ~56° at 3 m/s <span class="cite"><b class="tag ti">I</b> note 03</span>; the 2 mm fall speed used here (~6.4 m/s) is back-solved from those angles. Streak length is <code>speed × exposure</code>, at 32 px = 1 m, which the study puts at 3–8 px. Gusts peak at 1.3× the mean <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s81">S81</a></span>, every 4–12 s with ~1 s attack and 2–3 s release <span class="cite"><b class="tag ti">I</b> note 06</span>. The dry strip behind a wall is <code>h·tan θ</code>: a 3 m wall at 5 m/s shelters ~2.3 m.</figcaption>
</figure>

<!--FIG stack-->
<figure class="fig" data-demo="stack" id="fig-stack">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">The layered architecture, server to pixels</h4><span class="illu">Design proposal [I]</span></div>
  <div class="stack">
    <div class="layers">
      <button type="button" class="layer srv" data-l="L-server"><b>0</b><span>WeatherDirector (server, per region)<small>state, intensity, wind, seed, strikes, tile flags</small></span></button>
      <div class="layer-arrow">▼ broadcast on change: {state, intensity, wind, seed, next_strike}</div>
      <button type="button" class="layer" data-l="L-data"><b>1</b><span>Data textures (client)<small>COVER · WET · WATER · RIPPLE · MIST</small></span></button>
      <div class="layer-arrow">▼</div>
      <button type="button" class="layer" data-l="L-ground"><b>2</b><span>Ground shader<small>one CanvasItem shader: dither, wet LUT, water, rings, mist</small></span></button>
      <button type="button" class="layer" data-l="L-rain"><b>3</b><span>Rain layer<small>A4 full-screen + ≤ 300 near drops</small></span></button>
      <div class="layer-arrow">▼</div>
      <button type="button" class="layer" data-l="L-parts"><b>4</b><span>Pooled particles<small>splashes, drips, steam</small></span></button>
      <button type="button" class="layer" data-l="L-hooks"><b>5</b><span>Gameplay hooks<small>E3 · F3 · F4 · F5 · F6 ← server flags</small></span></button>
    </div>
    <div class="ldet" aria-live="polite"></div>
  </div>
  <template id="L-server"><h4>WeatherDirector (server, per region)</h4><ul><li>States: CLEAR · OVERCAST · DRIZZLE · LIGHT · MODERATE · HEAVY · STORM</li><li>Schedule from a forecast table (FC6 hourly presets, FFT month odds, DST sine envelope)</li><li>Intensity eases over 20–60 s; <code>wind = base·(1 + 0.3·gust)</code>; a seed; strikes on tiles at least 1 s apart</li><li>Tile flags: wet, mud, puddle, fire. Gameplay rules read these.</li></ul><p>The server owns whatever changes outcomes; clients own the pixels. Ultima Online's weather packet was 4 bytes <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s18">S18</a></span>.</p></template>
  <template id="L-data"><h4>Data textures (client)</h4><ul><li><b>COVER</b> R8 per tile, rebaked per wind bucket (E1, B2)</li><li><b>WET</b> R8 at 4×4 px, 8 Hz (C1, C3)</li><li><b>WATER</b> R8 at 2×2 px, 12 Hz, active list (C5)</li><li><b>RIPPLE</b> RG8 ping-pong at 30 Hz, hero ponds only (D1)</li><li><b>MIST</b> R8 at ¼ resolution, 12 Hz (G1, G2)</li></ul><p>Update on the CPU (<code>Image</code> → <code>ImageTexture.update</code>) or with <code>DrawableTexture2D</code> on Godot 4.7, which is in the Compatibility driver but marked experimental. Float targets on WebGL 2 need <code>EXT_color_buffer_float</code>, so prefer RGBA8.</p></template>
  <template id="L-ground"><h4>Ground CanvasItem shader</h4><p><code>idx → DRY|WET row by dither → WATER row if depth &gt; P (+ D2 rings, D1 slope) → MIST row by dither → overcast / flash uniforms</code></p><p>One LUT of 256 colours × {DRY, WET, MIST, SHADOW, FLASH} rows (H1). No compute on web.</p></template>
  <template id="L-rain"><h4>Rain layer</h4><p>One full-screen <code>canvas_item</code> running A4's hashed cells, masked by COVER, plus at most 300 landing-first near drops (A2/A3) that splash by material (C7). Curtains (A5) modulate both.</p></template>
  <template id="L-parts"><h4>Pooled particles</h4><p>Splashes, drips and steam from one pool, drawn with a MultiMesh or a single <code>_draw()</code>. GPU particles are limited on Compatibility.</p></template>
  <template id="L-hooks"><h4>Gameplay hooks</h4><p>A <code>rain_changed(tier)</code> signal drives NPC schedules, spawn tables, crop watering, fire rules, element multipliers and hearing and vision radii. Lightning strikes are server events that prefer tall or metal tiles and get a 1–2 s telegraph.</p></template>
  <figcaption>Click a layer to see what it holds. Everything here is the study's design proposal; none of it has been tested in Godot.</figcaption>
</figure>
