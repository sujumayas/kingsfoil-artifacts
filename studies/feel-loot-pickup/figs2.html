  <figcaption>Each bar is one rule from §6b; click a row to read it. Tibia's owner holds only the first corpse stage, 10 s, then the corpse is public until it rots [V, S10, S11, S12]. OSRS hides drops for 60 s, shows tradeables 120 s more and keeps untradeables private for 180 s [V, S48, S49]. rAthena staggers 3 + 2 + 2 s by damage rank, 10 + 10 + 2 s for MVPs, and items are gone at 60 s [V, S65]. Cosmic MapleStory gives the killer or party 15 s and expires items at 180 s [V, S71, S72]. For player corpses, Albion's black zone gives 90 s of priority [V, S76] and Felucca lets anyone loot [V, S80, S81]. Guild Wars 2 gives every contributor personal loot [V, S120]. Corpse games use 3 to 22 s, and OSRS needs 60 s because players must walk to ground items [V, S48; I, note 04]. Below, the same drop seen by a stranger. OSRS hides it, Cosmic sends the owner ID so the client can grey it [V, S71], and Canary shows a plain corpse and blocks the open [V, S7, S21]. Asterion shows and marks it with the time left [I]. Click the panels.</figcaption>
