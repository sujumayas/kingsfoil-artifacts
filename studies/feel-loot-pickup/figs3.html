  <figcaption>Every coloured bar is a measured row of §6d <span class="cite"><b class="tag tv">V</b> S5</span>; rows with two or three values are split into one bar each. Cost follows blits, not effects. One item blit costs about 1.1 µs on the GPU and 16 µs in software, so a software client affords about 550 a frame <span class="cite"><b class="tag tv">V</b> S5<i>;</i> <b class="tag ti">I</b></span>. The two traps stand out. 200 glows with <code>shadowBlur</code> fill more than a whole frame on the M4 GPU, and 1000 labels drawn glyph by glyph cost 11.45 ms against 1.50 ms from an atlas. Compare SwiftShader rows only within their own column, since software GL runs everything on the CPU. <b>Run the rows</b> repeats the Canvas 2D tests with this page's sprites, halos, beams and labels on your device. Those green bars use this page's code, not the benchmark's.</figcaption>
