<figure class="fig" data-demo="carried" id="fig-carried">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Carried light as a design: what you hold, how long it lasts, and who sees you</h4><span class="illu">Burn speed and notice radius illustrative</span></div>
  <div class="duo wide-l">
    <div><div class="stage click"><canvas width="160" height="90" aria-label="The village at night following a walker who carries a light; click to walk"></canvas><div class="hud" data-hud></div></div></div>
    <div><div class="ctl col" style="margin-top:0">
        <div class="seg" data-seg="ty" role="group" aria-label="Carried light"><button type="button" class="on" data-v="torch">Torch h 10</button><button type="button" data-v="lantern">Lantern h 9</button><button type="button" data-v="orb">Light spell h 16</button></div>
        <div class="seg" data-seg="fuel" role="group" aria-label="Fuel model"><button type="button" class="on" data-v="steps">Radius steps (Tibia)</button><button type="button" data-v="smooth">Smooth shrink</button><button type="button" data-v="none">No fuel</button></div>
        <label><input type="checkbox" data-k="stealth" checked> Lurkers notice you inside 1.2 × your light radius</label>
        <label><input type="checkbox" data-k="auto" checked> Walk the patrol route</label>
        <button type="button" class="btn" data-b="refuel">Fresh fuel</button>
      </div><div class="readout" data-ro aria-live="polite"></div></div>
  </div>
  <figcaption>The Sandbox carries a torch or lantern at <code>player.x ± 4</code> by facing, the lantern swaying 1 px with the stride, while the light spell eases after the player at <code>min(1, 3·dt)</code> and floats 14 px up; carried rays start at 3 px so the carrier's own feet do not block them <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s6">S6</a></span>. The patrol passes the barrels: a torch at 10 px is blocked by barrels (9 ≥ 6), a spell at 16 px floats over them (threshold 9.6) <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s6">S6</a></span>. Tibia's fuel is the radius stepping down, 7 → 6 → 5 tiles over 10 + 5 + 5 minutes <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s35">S35</a></span>, readable in a way a smooth shrink is not <span class="cite"><b class="tag ti">I</b></span>; here a minute is a second. In Diablo the light radius also sets when monsters react <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s48">S48</a>, <a class="sref" href="#s49">S49</a></span>, and Thief's light gem shows how visible you are <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s82">S82</a></span>; the readout's gem is the light level at the carrier's feet. For an MMO the study keeps that trade-off to special zones <span class="cite"><b class="tag ti">I</b> note 06</span>.</figcaption>
</figure>

<!--FIG budget-->
<figure class="fig" data-demo="budget" id="fig-budget">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">The light budget, worked live: work units against the study's proposed limits</h4><span class="illu">Presets illustrative; no Godot timings exist yet</span></div>
  <div class="budget">
    <div>
      <div class="ctl presets" style="margin-top:0"><span class="mini">Presets:</span><button type="button" class="btn" data-pre="study">Study's proposal</button><button type="button" class="btn" data-pre="sandbox">Sandbox at 21:00</button><button type="button" class="btn" data-pre="heavy">Overloaded</button></div>
      <div class="ctl">
        <div class="seg" data-seg="res" role="group" aria-label="Internal resolution"><button type="button" data-v="320">320×180</button><button type="button" class="on" data-v="480">480×270</button><button type="button" data-v="640">640×360</button></div>
        <div class="seg" data-seg="lm" role="group" aria-label="Light map scale"><button type="button" data-v="1">Light map full</button><button type="button" class="on" data-v="0.5">½</button><button type="button" data-v="0.25">¼</button></div>
        <label class="rng"><span>Stamped lights</span><input type="range" data-k="n" min="0" max="80" value="30"><output data-o="n"></output></label>
        <label class="rng"><span>Average radius (px)</span><input type="range" data-k="r" min="10" max="120" value="80"><output data-o="r"></output></label>
        <label class="rng"><span>Real Light2D on screen</span><input type="range" data-k="l2" min="0" max="24" value="8"><output data-o="l2"></output></label>
        <label class="rng"><span>…of which shadowed</span><input type="range" data-k="sh" min="0" max="8" value="2"><output data-o="sh"></output></label>
        <label class="rng"><span>CPU polar re-casts / frame</span><input type="range" data-k="rc" min="0" max="20" value="5"><output data-o="rc"></output></label>
        <div class="seg" data-seg="pcf" role="group" aria-label="Shadow filter"><button type="button" class="on" data-v="1">Filter None (1 tap)</button><button type="button" data-v="5">PCF5</button><button type="button" data-v="13">PCF13</button></div>
      </div>
    </div>
    <div><svg class="chart" viewBox="0 0 420 300" role="img" aria-label="Bars for light-map fills, Light2D counts, shadow passes and CPU ray time against the study's limits"></svg><div class="verdict" aria-live="polite"></div></div>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>The arithmetic is the study's worked example: a 480×270 view with 16 px tiles is 30×17 = 510 tile texels; a half-resolution light map is 240×135 = 32,400 texels; an R = 80 px torch stamps about 5k texels at half resolution, so 30 lights ≈ 150k fills, "well under 1 ms GPU"; real Light2D should stay at 8–12 on screen with 1–3 shadowed, each shadowed light costing 4 occluder passes and 1, 5 or 13 taps; a CPU polar cast costs about 60 µs in JavaScript, and all lighting should stay under about 2–3 ms of a 16.7 ms frame <span class="cite"><b class="tag ti">I</b></span>. Godot itself caps 15 lights per item and 64 per render on small-UBO devices <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s88">S88</a></span>. Only the CPU ray time is shown in milliseconds, because that is the only timing the study has; the study notes that no WebGL2 benchmark of Godot's 2D lights exists yet <span class="cite"><b class="tag tu">U</b></span>.</figcaption>
</figure>
