<!--FIG score-->
<figure class="fig" data-demo="score" id="fig-score">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Scorecard: sortable heat table and radar comparison</h4></div>
  <div class="score-wrap">
    <div class="tbl" style="margin:0"><table class="heat"><thead></thead><tbody></tbody></table></div>
    <div class="radar-box"><svg class="chart" role="img" aria-label="Radar comparison of selected verbs"></svg><div class="radar-keys"></div></div>
  </div>
  <figcaption>Click a column header to sort. Click rows to compare up to three verbs on the radar; the oldest pick drops off. Ratings are author judgement in the order Feel · Readability · Run fit · Cheapness · Evidence. Sort by Run fit, because the question was which verbs survive a leaderboard and four shipped maps. The two rows at 24, the verb gate (G1) and the automatic mantle (C1), are the changes that make everything else safe. The seven rows at 23 are the recommended set's spine: the slide-jump (B2), the pogo (F2), the deflect as a property (F3), the dash-jump economy (A5) and the budget (H1). Readability is where the katana verbs pay, since a held button has no shape until the sheathe pose gives it one. The only 2s in Cheapness are the two figure-only verbs, the hammer (E1) and the drawn slope (E2) <span class="cite"><b class="tag ti">I</b></span>.</figcaption>
</figure>
<!--/FIG-->
<!--FIG matrix-->
<figure class="fig" data-demo="matrix" id="fig-matrix">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Feel against cost for all 39 profiles, Feel plus Readability plus Run fit across, Cheapness plus Evidence up</h4></div>
  <svg class="chart mx-chart" viewBox="0 0 600 320" role="img" aria-label="Scatter of the 39 verb profiles: feel plus readability plus run fit across, cheapness plus evidence up"></svg>
  <div class="legend-mini" data-leg></div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Each dot is one profile at its §5 ratings. Across is how good it is in the hands and in a race, Feel plus Readability plus Run fit. Up is how cheap it is for a five-person Canvas2D team and how strong its sources are, Cheapness plus Evidence. Dots that share a cell sit side by side. Hover or tap a dot to read it and follow the link to its card. The top right corner is the first month of the backlog: the mantle (C1), the verb gate (G1), the slide-jump (B2), the pogo (F2), the deflect (F3) and the budget (H1). The bottom left holds the verbs the user named and the study answers with a figure or an unranked map: the comedy map (E5), the elastic rope (D3), the hammer (E1) and the drawn slope (E2) <span class="cite"><b class="tag ti">I</b></span>.</figcaption>
</figure>
<!--/FIG-->
<!--FIG dashchart-->
<figure class="fig" data-demo="dashchart" id="fig-dashchart">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Dash distance in body lengths against speed as a multiple of run, per game, with SpeedRunner's proposals marked</h4><span class="illu">Some rows unpublished</span></div>
  <svg class="chart paper dc-chart" viewBox="0 0 600 340" role="img" aria-label="Dot chart of dash speed multiple across and dash distance in body lengths up for each game in section 6a; SpeedRunner's Sandbox dash and the dash-slash are red"></svg>
  <div class="legend-mini" data-leg></div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Every dot is a row of §6a. Across is the dash speed as a multiple of the game's run speed, up is the distance one dash covers in body lengths with the conversions of §2, Celeste 1 BL = 11 px, Mega Man X about 34 px, Hollow Knight's Knight about 1.25 u. Celeste dashes at 2.67x for 3.3 BL, Mega Man X at 2.33x walk and about 4.5 BL with the jump, Hollow Knight at 2.4x for about 4 body heights <span class="cite"><b class="tag tv">V</b> S7<i>;</i> S131<i>;</i> S21</span>. Dustforce, Neon White's Godspeed and Pizza Tower's Mach ladder publish no usable pair and are listed to the side <span class="cite"><b class="tag tu">U</b></span>. The red dots are the proposals: the Sandbox dash at 2.67x for 3.65 BL, a comparison toggle, and the recommended dash-slash at 2.0x for 1.8 to 2.7 BL, drawn as its range <span class="cite"><b class="tag tk">K</b><i>;</i> <b class="tag ti">I</b></span>. The whole canon dashes at 2.3x to 2.7x for 150 to 250 ms and covers 3 to 4 body lengths; the two numbers that decide a dash's character are not on this chart, the refill rule and the exit speed. Hover a dot for its duration, directions, refill and cooldown from the table.</figcaption>
</figure>
<!--/FIG-->
<!--FIG budgetchart-->
<figure class="fig" data-demo="budgetchart" id="fig-budgetchart">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Verbs against action buttons per game, with SpeedRunner today and the recommended set</h4><span class="illu">Verb counts from the §6e cells</span></div>
  <svg class="chart paper bc-chart" viewBox="0 0 600 340" role="img" aria-label="Scatter of action buttons across and verbs up for each game in section 6e; SpeedRunner today and SpeedRunner recommended are red"></svg>
  <div class="legend-mini" data-leg></div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Every dot is a row of §6e: across, the action buttons beside the direction input; up, the verbs the table lists for that game, counted from its cell. N++ is one button and four verbs; Celeste is three plus the Crouch Dash bind it added in v1.4.0.0 on 29 Mar 2021 because runners were already binding it with Joy2Key; Katana ZERO is three; Neon White sells its movement as cards on a discard button <span class="cite"><b class="tag tv">V</b> S172<i>;</i> S14<i>;</i> S41<i>;</i> S151<i>;</i> S64</span>. Getting Over It, Solipskier and Doodle Jump have no button count because their verb is an analog pointer or a tilt, and they are listed to the side. Crawford's bound is "fewer than ten verbs"; the dashed line is the three-button ceiling the designers agree on <span class="cite"><b class="tag tv">V</b> S173</span>. SpeedRunner today is one button and six verbs. The recommended set is three buttons, Move, Jump and Katana, with Down and Up as modifiers, and fifteen verbs, inside the bound because nine of them are context verbs that read the body's state instead of a new input <span class="cite"><b class="tag tk">K</b><i>;</i> <b class="tag ti">I</b></span>. Hover a dot for the context inputs and the board categories from the table.</figcaption>
</figure>
