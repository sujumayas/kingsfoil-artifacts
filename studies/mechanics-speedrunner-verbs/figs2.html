  <div style="max-width:680px;"><div class="stage" data-nofit><canvas width="640" height="360" aria-label="A small course with a 32 unit corridor, a one-way tile and a wall. A samurai crouches to a 20 by 26 hitbox, crawls under the corridor, fails to stand while pinned, buffers a jump that fires on the way out, crouches on the tile without dropping, and slides into the wall where he stops for 100 ms instead of sticking. A blue probe box shows when the wall kit is live"></canvas></div></div>

  <figcaption>The crouch shrinks from the head down with the feet fixed, so landings are unchanged and only <code>canStand</code> tests the 46 u box, against solids and never one-way tiles, as Celeste's <code>CanUnDuck</code> tests <code>Solid</code> only [K; V, S7; I]. Down on a one-way tile is a crouch, not a drop-through, because m4 is a maze of one-way roof tiles and a drop-through would void its medals [K; I]. No wall kit while crouched. The probe derives from the live hitbox, so a crouched body touching a wall gets a 100 ms stand-up stop, not the 25 u/s stick [K; I]. Standing up under a lip keeps sliding and tries the 8 u sideways correction first, with a pinned jump buffered 130 ms [S4 A2; K; I]. The figure runs the report's <code>setCrouch</code> and <code>canStand</code> on its own small integrator because the shared step uses a fixed 46 u box.</figcaption>
</figure>

  <figcaption>Fristrom's constraint, used in Spider-Man 2 and Energy Hook. Euler step, then project the test position back onto the rope circle when it falls outside, then recompute velocity from the corrected move [V, S19]. The figure runs the report's <code>stepHook</code> before the collision pass with gravity symmetric while hooked. At L = 276 u and g = 2500 a 45° entry at maxRun leaves at 762 u/s and a straight drop at 1175, above maxFall, which is why the release caps at 760 u/s, 1.8x maxRun; the period 2π√(L/g) comes out at 2.09 s in the figure, not the 0.66 s the report prints, a slip the figure notes record [K; I]. The ring hook is Up + Katana in the air, fired at 45° at 1700 u/s with a 300 u reach, rope length fixed at the attach distance, pump at 900 u/s² along the tangent, release on button up [V, S18, S125; I]. Untick the cap and watch the landing overshoot.</figcaption>
</figure>

  <figcaption>Ghostrunner's grapple fires only at designer-placed orbs and zips rather than swings [V, S108]. Terraria publishes the one complete table. The first Grappling Hook reaches 18.75 tiles, 6.25 BL at 3 tiles per body, launches at 59 mph and pulls at 56 against a 15 mph walk [V, S18]. SpeedRunner's ring is radius 20 u and snaps within 30 u of the fixed 45° ray; the zip variant pulls at 1550 u/s, hangs gravity-free and leaves on Jump, the deterministic fallback if the swing tests badly [V, S18; I]. A rope that latches to any ceiling makes every chimney and roof tile in m3 and m4 a shortcut, so "any surface" is a comparison only [K; I]. Reel and elastic ropes stay references. A reel needs Up and Down while hooked, and Down is the crouch; Umihara Kawase's spring line is the most expressive rope on the list and the hardest to read in 46 u of hero [V, S105, S110; I].</figcaption>

  <figcaption>Input is "a mouse or trackpad to move the character's upper body and sledgehammer"; controllers are "considerably harder" [V, S118]. A Godot clone clamps the cursor target to a 110-unit reach around the body and moves the head toward it with a 0.59 responsiveness factor per step [V, S122]. Foddy's own pot mass, joint and motor force are unpublished [U]. The community's technique chapters, swing, windmill, pogo, bounce, are patterns inside one mapping [U, S123]. The figure is a two-body toy, not Foddy's simulation. A pointer path at 120 Hz is replayable but never comparable across players, and the game is keyboard-only today, so the hammer is a figure and not a toggle [K; I]. What transfers is depth inside one input, which F4's iai hold and H2's chords apply to the katana button, and D5's charged jump is the one discrete descendant that fits [I].</figcaption>
</figure>

  <figcaption>Solipskier draws the slope while riding; downhill adds speed, inclines launch tricks, upcoming gates show on the right with their required altitude, and the game starts on the first click with no tutorial [V, S127]. Tiny Wings holds to drop so the hill launches the bird, designed "for a 1.5-year-old child" [V, S128]. Line Rider draws the track first and presses Play [V, S130]. The clones snap the foot to the segment under its x and grow speed with the downhill component of gravity [U]. On a 30° downslope a sliding hero gains g sin 30° = 1250 u/s², three times maxRun in a second, which is why slopes need a cap [K; I]. Slopes do not exist in SpeedRunner, solids are AABB only, and the player authors the route, so times are not comparable. The verb that survives is the slope slide, crouch on a down-ramp and release at the lip, once the collision pass learns slopes [K; I].</figcaption>
