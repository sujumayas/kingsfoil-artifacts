<pre id="out">Magic and spell VFX benchmark. Call runCPU({only:'regex'}) / await runGPU({only:'regex'}) from the console or Playwright.</pre>
<script>
"use strict";
// ---------------- harness (same as studies/vfx-grass/notes/bench/grassbench.html) ----------------
// Each sample runs fn repeatedly until >= minSampleMs elapsed. Median of samples, p10/p90 reported.
function bench(name, fn, opts = {}) {
  const warmMs = opts.warmMs ?? 150, samples = opts.samples ?? 25, minSampleMs = opts.minSampleMs ?? 8;
  let t0 = performance.now();
  while (performance.now() - t0 < warmMs) fn();
  const per = [];
  for (let s = 0; s < samples; s++) {
    let n = 0; const a = performance.now(); let b;
    do { fn(); n++; b = performance.now(); } while (b - a < minSampleMs);
    per.push((b - a) / n);
  }
  per.sort((x, y) => x - y);
  return { name, median_ms: +per[samples >> 1].toFixed(4), p10_ms: +per[Math.floor(samples * 0.1)].toFixed(4), p90_ms: +per[Math.floor(samples * 0.9)].toFixed(4) };
}
let SINK = 0;
function hash2(ix, iy) {
  let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
let RNG = 2463534242;
function rnd() { RNG ^= RNG << 13; RNG ^= RNG >>> 17; RNG ^= RNG << 5; return (RNG >>> 0) / 4294967296; }
const W = 320, H = 180;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function mainCtx() { return mkCanvas(W, H).getContext('2d', { willReadFrequently: true }); }
function sync(cx) { SINK += cx.getImageData(0, 0, 1, 1).data[1]; }
const clampX = v => v < 1 ? 1 : v > W - 2 ? W - 2 : v, clampY = v => v < 1 ? 1 : v > H - 2 ? H - 2 : v;

// ---------------- assets built in code ----------------
// 5-step fire ramp, dark edge to white-hot core. ABGR for little-endian Uint32 writes. Index 0 = transparent.
const RAMP = Uint32Array.of(0, 0xff1a1a5a, 0xff1f33c2, 0xff1c7af0, 0xff3fd2ff, 0xffd6f7ff);
const RAMP_CSS = ['rgba(0,0,0,0)', '#5a1a1a', '#c2331f', '#f07a1c', '#ffd23f', '#fff7d6'];
const RAMP_F = [0, 0, 0, .35, .1, .1, .76, .2, .12, .94, .48, .11, 1, .82, .25, 1, .97, .84];
// flipbook: F frames of SxS ramp indices (grayscale frame quantised to the 5-step ramp). Expanding, hollowing fireball.
function genFlip(S, F, salt) { const frames = [], cover = [];
  for (let f = 0; f < F; f++) { const a = new Uint8Array(S * S), t = f / (F - 1), r = 0.3 + 0.7 * t; let n = 0;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const dx = (x + .5 - S / 2) / (S / 2), dy = (y + .5 - S / 2) / (S / 2), d = Math.hypot(dx, dy);
      let v = (1 - d / r) * (1.15 - 0.9 * t) + (hash2(x * 3 + f * 17, y * 3 + S + salt) - .5) * 0.35; if (d < t * 0.9 - 0.25 || d > r) v = 0;
      const idx = v <= 0.08 ? 0 : Math.min(5, 1 + Math.floor(v * 5)); a[y * S + x] = idx; if (idx) n++; }
    frames.push(a); cover.push(n); }
  return { S, F, frames, cover }; }
const FLIP = { 32: genFlip(32, 8, 0), 64: genFlip(64, 8, 5) }, TILE = genFlip(16, 8, 9);
// character 16x24, palette-indexed (0 transparent, 1..4)
const CHAR = new Uint8Array(16 * 24); for (let y = 0; y < 24; y++) for (let x = 0; x < 16; x++) { const hd = Math.hypot(x - 7.5, y - 5.5); let v = 0;
  if (hd < 4.6) v = hd > 3.6 ? 1 : 3; else if (y >= 10 && y < 22 && x >= 3 && x < 13) v = (x === 3 || x === 12 || y === 21) ? 1 : (y < 16 ? 2 : 4); else if (y >= 22 && (x === 5 || x === 6 || x === 9 || x === 10)) v = 1; CHAR[y * 16 + x] = v; }
const CHARPAL = Uint32Array.of(0, 0xff201820, 0xffa04838, 0xff9cc4f0, 0xff603828), CHARPAL_TINT = Uint32Array.of(0, 0xff182818, 0xff58a040, 0xff8cf0a0, 0xff386830);
// aura ring 24x12, 4 frames, split into back half (upper arc) and front half (lower arc)
const AURA_B = [], AURA_F = []; for (let f = 0; f < 4; f++) { const b = new Uint8Array(24 * 12), fr = new Uint8Array(24 * 12);
  for (let y = 0; y < 12; y++) for (let x = 0; x < 24; x++) { const d = Math.hypot((x - 11.5) / 11.5, (y - 5.5) / 5.5); if (d > 0.72 && d <= 1) { const v = 2 + ((x + y + f) & 3 ? 1 : 2); (y < 6 ? b : fr)[y * 24 + x] = v; } }
  AURA_B.push(b); AURA_F.push(fr); }
// missile 8x8, 5 fade levels (level 0 = head, 1..4 = pre-faded ghosts)
const MIS = []; for (let k = 0; k < 5; k++) { const a = new Uint8Array(64); for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const d = Math.hypot(x - 3.5, y - 3.5); a[y * 8 + x] = d < 1.6 ? Math.max(1, 5 - k) : d < 3.2 ? Math.max(1, 4 - k) : d < 4 ? Math.max(1, 2 - k) * (k < 3 ? 1 : 0) : 0; } MIS.push(a); }
// one 512x128 atlas canvas shared by Canvas2D and WebGL2: flip64 at (0,0), flip32 at (0,64), tile16 at (256,64), missile at (256,80),
// orb 2x2 x5 at (300,80), halo 16x16 at (320,80), particle 3x3 x5 at (340,80), tinted char (360,64), char (384,64), aura back (400,64), aura front (400,76)
const atlas = mkCanvas(512, 128), ATL = new Uint32Array(512 * 128);
function putIdx(a, w, h, ax, ay, pal) { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = a[y * w + x]; if (v) ATL[(ay + y) * 512 + ax + x] = pal[v]; } }

for (let k = 0; k < 5; k++) { putIdx(MIS[k], 8, 8, 256 + k * 8, 80, RAMP); for (let j = 0; j < 4; j++) ATL[(80 + (j >> 1)) * 512 + 300 + k * 2 + (j & 1)] = RAMP[k + 1]; for (let j = 0; j < 9; j++) ATL[(80 + (j / 3 | 0)) * 512 + 340 + k * 3 + j % 3] = RAMP[k + 1]; }
for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const d = Math.hypot(x - 7.5, y - 7.5) / 8, a = d >= 1 ? 0 : ((1 - d) * (1 - d) * 150) | 0; ATL[(80 + y) * 512 + 320 + x] = (a << 24) | 0x1c7af0; }
putIdx(CHAR, 16, 24, 360, 64, CHARPAL_TINT); putIdx(CHAR, 16, 24, 384, 64, CHARPAL);
for (let f = 0; f < 4; f++) { putIdx(AURA_B[f], 24, 12, 400 + f * 24, 64, RAMP); putIdx(AURA_F[f], 24, 12, 400 + f * 24, 76, RAMP); }
atlas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(ATL.buffer), 512, 128), 0, 0);
// busy stone courtyard ground
const ground = mkCanvas(W, H); { const g = ground.getContext('2d'); for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) { const v = hash2(x, y), e = (x % 16 < 2 || y % 16 < 2); g.fillStyle = e ? '#3a3a44' : v < 0.3 ? '#5a5a66' : v < 0.8 ? '#646472' : '#72727e'; g.fillRect(x, y, 2, 2); } }
const groundU32 = new Uint32Array(ground.getContext('2d').getImageData(0, 0, W, H).data.buffer.slice(0));
const vigCv = mkCanvas(W, H); { const g = vigCv.getContext('2d'), gr = g.createRadialGradient(160, 90, 60, 160, 90, 185); gr.addColorStop(0, 'rgba(120,0,0,0)'); gr.addColorStop(1, 'rgba(120,0,0,0.7)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
const VIG = new Uint8Array(W * H); for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const d = Math.hypot((x - 160) / 185, (y - 90) / 185 * 1.6), b = ((x & 1) + (y & 1) * 2) / 4; VIG[y * W + x] = d * 3.2 - 1.4 + b * 0.5 > 1 ? (d * 3.2 - 1.4 + b * 0.5 > 2 ? 2 : 1) : 0; }
const BAYER = Uint8Array.of(0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5);

// ---------------- the 30-caster load ----------------
// 1x: 30 casters, each with a missile in flight, an impact playing, an aura, 148 tile effects (4 area spells of 37 tiles), 1,300 particles, 4 chain bolts.
function casterPos(n) { const x = new Int16Array(n), y = new Int16Array(n); for (let i = 0; i < n; i++) { x[i] = 24 + (hash2(i, 41) * (W - 48) | 0); y[i] = 30 + (hash2(i, 43) * (H - 60) | 0); } return { x, y }; }
function LOAD(mult, clarity) { const k = clarity ? (1 + 29 * 0.4) / 30 : 1; return { mult, clarity, casters: 30 * mult, missiles: 30 * mult, impacts: 30 * mult, tiles: 148 * mult, particles: Math.round(1300 * mult * k), bolts: 4 * mult, glowImpacts: clarity ? mult : 30 * mult, glowParticles: clarity ? Math.round(1300 * mult / 30) : 1300 * mult }; }

// ---------------- particles ----------------
const EMIT = casterPos(30);
function spawnP(P, pre) { const i = P.n++, e = (rnd() * 30) | 0, a = rnd() * 6.2832, s = 10 + rnd() * 50, m = 0.3 + rnd() * 0.5, el = m * pre * 0.98;
  P.vx[i] = Math.cos(a) * s; P.vy[i] = Math.sin(a) * s - 10; P.x[i] = EMIT.x[e] + P.vx[i] * el; P.y[i] = EMIT.y[e] + P.vy[i] * el; P.max[i] = m; P.life[i] = m - el; }
function makePool(cap) { const P = { n: 0, cap, x: new Float32Array(cap), y: new Float32Array(cap), vx: new Float32Array(cap), vy: new Float32Array(cap), life: new Float32Array(cap), max: new Float32Array(cap) }; while (P.n < cap) spawnP(P, rnd()); return P; }
function simSoA(P, dt) { const { x, y, vx, vy, life, max } = P; let n = P.n;
  for (let i = 0; i < n;) { const l = life[i] - dt; if (l <= 0) { n--; x[i] = x[n]; y[i] = y[n]; vx[i] = vx[n]; vy[i] = vy[n]; life[i] = life[n]; max[i] = max[n]; continue; }
    life[i] = l; vx[i] *= 0.97; vy[i] = vy[i] * 0.97 + 20 * dt; x[i] += vx[i] * dt; y[i] += vy[i] * dt; i++; }
  P.n = n; while (P.n < P.cap) spawnP(P, 0); }
function newObj(pre) { const e = (rnd() * 30) | 0, a = rnd() * 6.2832, s = 10 + rnd() * 50, m = 0.3 + rnd() * 0.5, el = m * pre * 0.98, vx = Math.cos(a) * s, vy = Math.sin(a) * s - 10; return { x: EMIT.x[e] + vx * el, y: EMIT.y[e] + vy * el, vx, vy, life: m - el, max: m }; }
function makeAoS(cap) { const arr = []; while (arr.length < cap) arr.push(newObj(rnd())); return { cap, arr }; }
function simAoS(S, dt) { const out = []; for (const p of S.arr) { p.life -= dt; if (p.life <= 0) continue; p.vx *= 0.97; p.vy = p.vy * 0.97 + 20 * dt; p.x += p.vx * dt; p.y += p.vy * dt; out.push(p); } while (out.length < S.cap) out.push(newObj(0)); S.arr = out; }
function newObjV(pre) { const o = newObj(pre); return { pos: { x: o.x, y: o.y }, vel: { x: o.vx, y: o.vy }, life: o.life, max: o.max }; }
function makeAoSV(cap) { const arr = []; while (arr.length < cap) arr.push(newObjV(rnd())); return { cap, arr }; }
// the "immutable vector" style: two fresh objects per particle per frame plus filter()
function simAoSV(S, dt) { S.arr = S.arr.filter(p => (p.life -= dt) > 0); for (const p of S.arr) { p.vel = { x: p.vel.x * 0.97, y: p.vel.y * 0.97 + 20 * dt }; p.pos = { x: p.pos.x + p.vel.x * dt, y: p.pos.y + p.vel.y * dt }; } while (S.arr.length < S.cap) S.arr.push(newObjV(0)); }
function pcol(P, i) { return 1 + ((P.life[i] / P.max[i]) * 4.99 | 0); }
function partsFillRect(cx, P) { for (let i = 0; i < P.n; i++) { const s = 1 + i % 3; cx.fillStyle = RAMP_CSS[pcol(P, i)]; cx.fillRect(P.x[i] | 0, P.y[i] | 0, s, s); } }
function partsFillRectByColour(cx, P) { for (let c = 1; c <= 5; c++) { cx.fillStyle = RAMP_CSS[c]; for (let i = 0; i < P.n; i++) if (pcol(P, i) === c) { const s = 1 + i % 3; cx.fillRect(P.x[i] | 0, P.y[i] | 0, s, s); } } }
function partsPath(cx, P) { for (let c = 1; c <= 5; c++) { cx.fillStyle = RAMP_CSS[c]; cx.beginPath(); for (let i = 0; i < P.n; i++) if (pcol(P, i) === c) { const s = 1 + i % 3; cx.rect(P.x[i] | 0, P.y[i] | 0, s, s); } cx.fill(); } }
function partsDrawImage(cx, P) { for (let i = 0; i < P.n; i++) { const s = 1 + i % 3; cx.drawImage(atlas, 340 + (pcol(P, i) - 1) * 3, 80, s, s, P.x[i] | 0, P.y[i] | 0, s, s); } }
function partsID(u32, P, n) { const x = P.x, y = P.y; n = n ?? P.n; let wr = 0;
  for (let i = 0; i < n; i++) { const xi = x[i] | 0, yi = y[i] | 0; if (xi < 0 || yi < 0 || xi > W - 3 || yi > H - 3) continue; const col = RAMP[pcol(P, i)], d = yi * W + xi, s = i % 3; u32[d] = col;
    if (s > 0) { u32[d + 1] = col; u32[d + W] = col; u32[d + W + 1] = col; if (s > 1) { u32[d + 2] = col; u32[d + W + 2] = col; u32[d + 2 * W] = col; u32[d + 2 * W + 1] = col; u32[d + 2 * W + 2] = col; } } }
}

// ---------------- flipbooks and tiles ----------------
function makeSprites(N, S, tileAligned) { const x = new Int16Array(N), y = new Int16Array(N); for (let i = 0; i < N; i++) { if (tileAligned) { x[i] = (hash2(i, 51) * 20 | 0) * 16; y[i] = (hash2(i, 53) * 11 | 0) * 16; } else { x[i] = hash2(i, 51) * (W - S) | 0; y[i] = hash2(i, 53) * (H - S) | 0; } } return { N, S, x, y }; }
function flipDraw(cx, Sp, tick, ax, ay) { const S = Sp.S; for (let i = 0; i < Sp.N; i++) cx.drawImage(atlas, ax + ((i + tick) & 7) * S, ay, S, S, Sp.x[i], Sp.y[i], S, S); }
function blitIdx(u32, fr, w, h, x, y, pal) { let s = 0; for (let r = 0; r < h; r++) { let d = (y + r) * W + x; for (let c = 0; c < w; c++, s++, d++) { const g = fr[s]; if (g) u32[d] = pal[g]; } } }
function flipID(u32, Sp, tick, FB) { const S = Sp.S; for (let i = 0; i < Sp.N; i++) blitIdx(u32, FB.frames[(i + tick) & 7], S, S, Sp.x[i], Sp.y[i], RAMP); }
// palette-ramp "additive": effects go to a Uint8 index layer; overlap takes the max and climbs one ramp step; one resolve pass paints it.
function blitIdxAdd(L, fr, S, x, y) { let s = 0; for (let r = 0; r < S; r++) { let d = (y + r) * W + x; for (let c = 0; c < S; c++, s++, d++) { const g = fr[s]; if (g) { const v = L[d]; L[d] = v === 0 ? g : (g > v ? g : v) < 5 ? (g > v ? g : v) + 1 : 5; } } } }
function resolveIdx(u32, L) { for (let i = 0; i < L.length; i++) { const v = L[i]; if (v) u32[i] = RAMP[v]; } }
function coverage(N, FB) { let px = 0; for (let i = 0; i < N; i++) px += FB.cover[i & 7]; return px; }

// ---------------- low-res glow buffer (Acid study F2 method: small intensity grid, blur, palette select through Bayer) ----------------
function makeGlow(sh) { const GW = W >> sh, GH = H >> sh, r = 16 >> sh, disk = []; for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const d2 = dx * dx + dy * dy; if (d2 <= r * r) disk.push(dx, dy, 255 - (d2 * 160 / (r * r) | 0)); }

function glowSplatParts(G, P, n) { const I = G.I, sh = G.sh, GW = G.GW; for (let i = 0; i < n; i++) { const x = P.x[i], y = P.y[i]; if (x < 0 || y < 0 || x >= W || y >= H) continue; const k = (y >> sh) * GW + (x >> sh), v = 60 + pcol(P, i) * 30; if (I[k] < v) I[k] = v; } }

// ---------------- missiles and trails ----------------
function makeMis(M, L) { const m = { M, L, tick: 0, head: 0, hx: new Float32Array(M), hy: new Float32Array(M), ang: new Float32Array(M), ring: new Int16Array(M * L * 2) };

    m.hx[i] = x; m.hy[i] = y; ring[(i * L + h) * 2] = x; ring[(i * L + h) * 2 + 1] = y; } }
function line(u32, x0, y0, x1, y1, col) { const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1; let err = dx + dy;

      drawBatch(b, M * (L - 1), true);
      if (heads) { for (let i = 0, q = 0; i < M; i++, q += 8) { hd[q] = m.hx[i] - 4; hd[q + 1] = m.hy[i] - 4; hd[q + 2] = 8; hd[q + 3] = 8; hd[q + 4] = 256; hd[q + 5] = 80; hd[q + 6] = 0; hd[q + 7] = 0.98; } drawBatch(hb, M, true); } }; fn.m = m; return fn; }
  function Lghosts(M) { const m = makeMis(M, 12), b = mkBatch(PB, M * 5, ['ia', 'ib']), d = b.data; return () => { stepMis(m); const { ring, head, L } = m; let j = 0; for (let i = 0; i < M; i++) for (let g = 4; g >= 0; g--, j += 8) { const p = (i * L + (head - g * 2 + L) % L) * 2; d[j] = ring[p] - 4; d[j + 1] = ring[p + 1] - 4; d[j + 2] = 8; d[j + 3] = 8; d[j + 4] = 256 + g * 8; d[j + 5] = 80; d[j + 6] = 0; d[j + 7] = 0.98; } drawBatch(b, M * 5, true); }; }
  function Lfeedback(X, M) { const m = makeMis(M, 12), fbs = [mkFB(X.RW, X.RH), mkFB(X.RW, X.RH)], hb = mkBatch(PB, M, ['ia', 'ib']), hd = hb.data; let cur = 0;
    return () => { stepMis(m); const nx = 1 - cur; gl.bindFramebuffer(gl.FRAMEBUFFER, fbs[nx].fb); setRes(PF.fade, X.RW, X.RH); srcTex(fbs[cur].tex); full(PF.fade);
      for (let i = 0, q = 0; i < M; i++, q += 8) { hd[q] = m.hx[i] - 1; hd[q + 1] = m.hy[i] - 1; hd[q + 2] = 2; hd[q + 3] = 2; hd[q + 4] = 308; hd[q + 5] = 80; hd[q + 6] = 0; hd[q + 7] = 0.98; } drawBatch(hb, M, true);
      X.bindT(); setRes(PF.tex, X.RW, X.RH); srcTex(fbs[nx].tex); full(PF.tex, true); cur = nx; }; }
  function Lbolts(N, lv, every) { const B = makeBolts(N, lv), segs = (1 << lv) + 16, b = mkBatch(PSEG, N * segs * 2, ['ia', 'ib']), d = b.data, p = B.pts; let tick = 0;
    return () => { const regen = tick++ % every === 0; if (regen) { let j = 0; for (let pass = 0; pass < 2; pass++) for (let bi = 0; bi < N; bi++) { if (!pass) genBolt(B, bi); eachPoly(B, bi, (o, n) => { for (let i = 0; i < n - 1; i++, j += 8) { d[j] = p[o + i * 2]; d[j + 1] = p[o + i * 2 + 1]; d[j + 2] = p[o + i * 2 + 2]; d[j + 3] = p[o + i * 2 + 3]; d[j + 4] = pass ? 1 : 3; d[j + 5] = pass ? 5 : 3; d[j + 6] = pass ? 0.98 : 0.6; } }); } }
      drawBatch(b, N * segs * 2, regen); }; }
  // glow: sources -> G0 (bw x bh), 9-tap blur H -> G1, V -> G2, additive composite onto the target
  function Lglow(X, bw, bh, srcDraw) { const G = [mkFB(bw, bh, gl.LINEAR), mkFB(bw, bh, gl.LINEAR), mkFB(bw, bh, gl.LINEAR)];
    if (!srcDraw) { gl.bindFramebuffer(gl.FRAMEBUFFER, G[0].fb); gl.viewport(0, 0, bw, bh); Lflip(makeSprites(120, 32), 0, 64, true)(0); }
    return k => { gl.viewport(0, 0, bw, bh); if (srcDraw) { gl.bindFramebuffer(gl.FRAMEBUFFER, G[0].fb); gl.clear(gl.COLOR_BUFFER_BIT); srcDraw(k); }
      setRes(PF.blur, bw, bh); gl.bindFramebuffer(gl.FRAMEBUFFER, G[1].fb); gl.uniform2f(PF.blur.U.dir, 1, 0); srcTex(G[0].tex); full(PF.blur);
      gl.bindFramebuffer(gl.FRAMEBUFFER, G[2].fb); gl.uniform2f(PF.blur.U.dir, 0, 1); srcTex(G[1].tex); full(PF.blur);
      X.bindT(); setRes(PF.tex, X.RW, X.RH, 0.6); srcTex(G[2].tex); full(PF.tex, true); }; }
  function Lcopy(X) { return () => { gl.bindFramebuffer(gl.READ_FRAMEBUFFER, X.T.fb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, X.C.fb); gl.blitFramebuffer(0, 0, X.RW, X.RH, 0, 0, X.RW, X.RH, gl.COLOR_BUFFER_BIT, gl.NEAREST); gl.bindFramebuffer(gl.FRAMEBUFFER, X.T.fb); }; }
  function Lscreen(X, key, copy) { const cp = Lcopy(X), P = PF[key]; return k => { if (copy) { cp(); srcTex(X.C.tex); } setRes(P, X.RW, X.RH, key === 'flash' ? 0.6 : 0.98); gl.uniform1f(P.U.t, k / 40); full(P); }; }

  for (const [RW, RH] of [[320, 180], [1280, 720]]) { const X = ctxFor(RW, RH), tag = `${RW}x${RH}`; const frame = (...layers) => () => { const ls = layers.map(f => f()); return k => { X.bindT(); for (const l of ls) l(k); }; };
    await gpuBench(`g0 gpu baseline: ground quad ${tag}`, frame(() => Lground(X)));
    for (const N of [500, 2000, 8000, 32000]) {
      await gpuBench(`g1 gpu particles instanced, per-frame buffer upload N=${N} ${tag}`, frame(() => LpartsUpload(N, false)));
      await gpuBench(`g1 gpu particles instanced, upload + JS sim N=${N} ${tag}`, frame(() => LpartsUpload(N, true)));
      await gpuBench(`g1 gpu particles stateless (vertex shader from seed, age) N=${N} ${tag}`, frame(() => LpartsStateless(N))); }
    for (const S of [32, 64]) for (const N of [30, 120, 480]) { const Sp = makeSprites(N, S), ex = { px_effect: coverage(N, FLIP[S]), px_rect: N * S * S };
      await gpuBench(`g2 gpu flipbook batch alpha ${S}x${S} N=${N} ${tag}`, frame(() => Lflip(Sp, 0, S === 64 ? 0 : 64, false)), ex);
      await gpuBench(`g2 gpu flipbook batch additive ${S}x${S} N=${N} ${tag}`, frame(() => Lflip(Sp, 0, S === 64 ? 0 : 64, true)), ex); }
    await gpuBench(`g3 gpu separable 9-tap blur at ${tag} + additive composite (blur only, static source)`, frame(() => Lglow(X, RW, RH)));
    for (const [bw, bh] of [[80, 45], [160, 90], [320, 180]]) if (bw < RW) await gpuBench(`g3 gpu low-res glow ${bw}x${bh}: 120 impacts redrawn + blur + composite to ${tag}`, frame(() => Lglow(X, bw, bh, Lflip(makeSprites(120, 32), 0, 64, true))));
    await gpuBench(`g3 gpu glow as 240 additive halo quads 32x32 ${tag}`, frame(() => { const Sp = makeSprites(240, 32), b = mkBatch(PB, 240, ['ia', 'ib']), d = b.data; for (let i = 0; i < 240; i++) d.set([Sp.x[i], Sp.y[i], 32, 32, 320, 80, 0, 0.98], i * 8); let first = true; return () => { gl.useProgram(PB.p); const u = first; first = false; drawBatch(b, 240, true, true); }; }));
    for (const M of [60, 240, 960]) {
      await gpuBench(`g4 gpu trail ribbon segments L=12, upload M=${M} ${tag}`, frame(() => Ltrails(M, 12, false)), { instances: M * 11 });
      await gpuBench(`g4 gpu afterimages 4 ghosts + head batch M=${M} ${tag}`, frame(() => Lghosts(M)), { instances: M * 5 });
      await gpuBench(`g4 gpu feedback buffer (fade pass + heads + composite) M=${M} ${tag}`, frame(() => Lfeedback(X, M))); }
    for (const N of [10, 40, 160]) for (const ev of [1, 3]) await gpuBench(`g5 gpu bolts lv=5 halo+core segment quads, regen every ${ev} N=${N} ${tag}`, frame(() => Lbolts(N, 5, ev)), { instances: N * 96 });
    for (const N of [148, 1110, 2190]) { await gpuBench(`g6 gpu tile effects 16x16 batch N=${N} ${tag}`, frame(() => Lflip(makeSprites(N, 16, true), 256, 64, false)), { px_rect: N * 256 });
      if (N > 148) await gpuBench(`g6 gpu tile effects 32x32 batch N=${N} ${tag}`, frame(() => Lflip(makeSprites(N, 32), 0, 64, false)), { px_rect: N * 1024 }); }
    await gpuBench(`g7 gpu screen flash quad ${tag}`, frame(() => Lscreen(X, 'flash')));
    await gpuBench(`g7 gpu vignette shader ${tag}`, frame(() => Lscreen(X, 'vignette')));
    await gpuBench(`g7 gpu framebuffer copy only (blitFramebuffer) + flash ${tag}`, frame(() => { const c = Lcopy(X), f = Lscreen(X, 'flash'); return k => { c(); f(k); }; }));
    await gpuBench(`g7 gpu shockwave distortion incl. framebuffer copy ${tag}`, frame(() => Lscreen(X, 'shock', true)));
    await gpuBench(`g7 gpu palette LUT pass incl. framebuffer copy ${tag}`, frame(() => Lscreen(X, 'lut', true)));
    for (const C of [30, 120]) for (const [tint, label] of [['none', 'no tint'], ['attr', 'tint (c) as vertex attribute, 1 draw'], ['uniform', 'tint (c) as per-sprite uniform, C+2 draws']])
      await gpuBench(`g8 gpu auras back+front+6 orbiters+char, ${label} C=${C} ${tag}`, frame(() => Lauras(C, tint)), { instances: C * 9 });
    // composed scene. At 320x180 the frame is then upscaled 4x to a 1280x720 target (nearest); at 1280x720 everything is drawn native and the blur runs at full size.
    const SCR = RW === 320 ? mkFB(1280, 720) : null;
    for (const mult of [1, 4, 16]) for (const clarity of [false, true]) { const L = LOAD(mult, clarity);
      await gpuBench(`g9 gpu scene load ${mult}x clarity=${clarity ? 'on' : 'off'} ${RW === 320 ? '320x180 + 4x upscale' : 'native 1280x720'}`, () => {
        const imp = makeSprites(L.impacts, 32), trails = Ltrails(L.missiles, 12, true);
        const ls = [Lground(X), Lflip(makeSprites(L.tiles, 16, true), 256, 64, false), Lauras(L.casters, 'none'), trails, Lflip(imp, 0, 64, true), LpartsUpload(L.particles, true), Lbolts(L.bolts, 5, 3),
          RW === 320 ? Lglow(X, 80, 45, Lflip(imp, 0, 64, true, L.glowImpacts)) : Lglow(X, RW, RH, Lflip(imp, 0, 64, true, L.glowImpacts)), Lscreen(X, 'shock', true), Lscreen(X, 'vignette')];
        return k => { X.bindT(); for (const l of ls) l(k); if (SCR) { gl.bindFramebuffer(gl.FRAMEBUFFER, SCR.fb); gl.viewport(0, 0, 1280, 720); setRes(PF.tex, 1280, 720); srcTex(X.T.tex); full(PF.tex); } }; }, { load: L });
    } }
  return out;
}
window.runCPU = runCPU; window.runGPU = runGPU;
</script>
