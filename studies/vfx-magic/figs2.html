  <figcaption>Mindustry's laser draws three colours from the outside in, each about half the width of the last. It lives 16 ticks, 267 ms, grows to full length over the first 20% of its life and shrinks its width to 0 [V, S74]. The pixel version uses layers of 5, 3 and 1 px in palette colours, a 2-frame start cap and a 3-frame end splash that hide the line ends [I]. Untick the halo and the beam turns into a thin scratch. Untick the core and it loses its heat. A channel holds its width and re-casts its length every frame, as Mindustry's continuous laser does [V, S75]. One-shot beams of 250 to 500 ms match Mindustry and Shattered Pixel Dungeon's 0.5 s DeathRay [V, S74, S66]. The cost is 3 lines and 2 sprites per beam [I].</figcaption>

  <figcaption>Start with a straight line. Each generation splits every segment and moves the new midpoint along the perpendicular by <code>random(-offset, offset)</code>, then halves the offset. 5 generations give 32 segments. A branch leaves a midpoint at 0.7 of the length and is drawn dimmer [V, S87]. Tick "Hold this seed" and "Show the step before", then drag the generations slider. The grey line is the generation before and the gold dots are the new midpoints. The server sends only the target ids and one seed byte, and every client builds the same bolt [I]. Re-rolled every 3 frames it crackles, and every frame it looks like noise [I]. The halo stays a mid value, because a bright halo that changes shape 20 times a second is a large flicker, and a real cast lives 300 ms or less [I].</figcaption>
</figure>

  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Each bar is one frame. Its height is how bright and large the art is, and its width is how long it is held. Move the peak to frame 4 or 5, or click a bar. The effect now spends most of its life winding up on top of the dummy, and the flash lands long after the damage number. With the peak on frame 1 the climax and the number arrive together and the rest is a short tail. Riot asks for "anticipation and dissipation" and says "We intentionally minimize an effect's linger duration", but gives no percentages [V, S104]. The rule that the peak falls "within the first quarter" comes from VFX Apprentice's summary, not from Riot's guide [V, S101]. In the Sandbox the wind-up is the cast circle, so the spark itself can open on its peak. An effect may hide the target for 100 to 150 ms, 2 frames at 75 ms [I]. The front-loaded clock cuts that to 66 ms with the same five drawings.</figcaption>
</figure>
<!--/FIG-->

    <div><div class="stage"><canvas width="96" height="80" aria-label="An explosion on a stone floor: a yellow ring, five smoke discs and four spark lines, drawn from a seed and a time with nothing stored"></canvas><div class="hud" data-hud="a"></div></div><p class="pl"><b>Stateless.</b> Every shape is derived again from <code>(seed, t)</code> each frame.</p></div>
    <div><div class="stage"><canvas width="96" height="80" aria-label="The same explosion drawn from a pool of stored particles that are moved a step at a time"></canvas><div class="hud" data-hud="b"></div></div><p class="pl"><b>Stored pool.</b> Positions and velocities live in arrays and step forward only.</p></div>
  </div>

  <figcaption>A Mindustry effect is a function of id, time, lifetime, position, rotation and colour. <code>randLenVectors(seed, amount, length)</code> re-seeds its generator and returns the same directions every frame, <code>fin()</code> is <code>time / lifetime</code> and <code>fout()</code> is <code>1 - fin</code> [V, S77, S79]. This is <code>flakExplosion</code>. It lives 20 ticks (333 ms), its yellow ring lives 6 ticks through a nested shorter life, 5 smoke discs shrink from radius 3.5 to 0.5 and 4 spark lines fly out [V, S77, S76]. Drag the time slider backward. The left side just evaluates the earlier time. The pool has to respawn and step forward again, and the readout counts those steps. Raise the shape count and the pool's memory grows while the stateless side stays at about 16 bytes per effect [I]. The catch is that stateless sparks cannot bounce or collide, which nobody notices under 1 s [I].</figcaption>

    <label class="rng">Shield holds <input type="range" data-k="hits" min="2" max="6" step="1" value="4"><output data-o="hits"></output></label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Click anywhere around either mage to throw a bolt from that side. Riot's guide makes the border of Leona's shield its primary element, because players must read the radius, and gives defensive spells low saturation and a clear silhouette [V, S104]. Diablo II's Energy Shield has 8 directional hit overlays of 9 frames each, and hits 3, 4 and 5 are drawn behind the body [V, S61]. Here hits from the north side flash behind the mage in the same way. On break, Shattered Pixel Dungeon scales its halo from 1x to 2x radius over about 1 s while it fades [V, S81], which is the dotted ring you see when the last hit lands. Tibia draws no bubble at all and plays one spark per absorbed hit [V, S23, S30]. I would ship the rim for the owner and the party, and Tibia's hit-only spark for everyone else.</figcaption>
</figure>

<!--FIG statustint-->
<figure class="fig" data-demo="statustint" id="fig-statustint">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Status looks: one tint by priority, plus one small overlay</h4><span class="illu">Tint values, priority order and overlays illustrative</span></div>
  <div class="stage"><canvas width="192" height="96" aria-label="One large mage on the left tinted by its status, with a small icon over its head. On the right a crowd of thirty small characters, some tinted orange, green, blue or violet"></canvas></div>
  <div class="ctl">
    <label><input type="checkbox" data-k="burn" checked> Burning</label>
    <label><input type="checkbox" data-k="pois" checked> Poisoned</label>
    <label><input type="checkbox" data-k="froz"> Frozen</label>
    <label><input type="checkbox" data-k="shock"> Shocked</label>
    <div class="seg" data-seg="mode" role="group" aria-label="How statuses combine"><button type="button" class="on" data-v="pri">One tint by priority</button><button type="button" data-v="mul">Multiply them all</button></div>
    <button type="button" class="btn ghost" data-b="shuf">Shuffle the crowd</button>
    <button type="button" class="btn" data-b="rb">Measure the readback path</button>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Ragnarok uses one multiply colour per entity. Frozen is 0.0, 0.4, 0.8 with the pose held and poison is 0.9, 0.4, 0.8. Tints multiply, so stacked statuses go dark [V, S45]. Diablo II lets one tint win by <code>colorpri</code> [V, S60]. Tick three or four statuses and switch between the two rules. With priority the mage always shows one clear state. Multiplied, it turns to mud. The plan gives each status one motion as well. Burning flickers between two orange rows at 6 to 8 fps with 2 small flames, poisoned pulses at 1 Hz with a drip per second, shocked blinks one white frame at 2 to 3 Hz and frozen holds the pose [I]. Every shocked character here blinks on one shared clock, because out-of-phase blinks add up to a large flickering area [I]. A pre-tinted cached sprite costs nothing extra per frame. Remapping pixels through <code>getImageData</code> every frame cost 9 ms for 30 characters in our measurement [V, S13].</figcaption>
</figure>

<!--FIG castcircle-->
<figure class="fig" data-demo="castcircle" id="fig-castcircle">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">A cast circle that draws itself in, turns slowly and charges the hand</h4><span class="illu">Glyphs, draw-in order and particle counts illustrative</span></div>
  <div class="stage"><canvas width="192" height="108" aria-label="A mage stands on a flattened ring of runes that draws itself in while small lights gather at the raised hand. When the ring is complete the mage fires a missile and the ring fades"></canvas><div class="hud" data-hud></div></div>
  <div class="ctl">
    <div class="seg" data-seg="el" role="group" aria-label="Element"><button type="button" class="on" data-v="0">Fire</button><button type="button" data-v="1">Ice</button><button type="button" data-v="2">Energy</button><button type="button" data-v="4">Holy</button></div>
    <div class="seg" data-seg="size" role="group" aria-label="Circle size"><button type="button" data-v="20">40 px</button><button type="button" class="on" data-v="40">5 tiles</button><button type="button" data-v="56">7 tiles</button></div>
    <label class="rng">Cast time <input type="range" data-k="dur" min="0.2" max="3" step="0.1" value="1.5"><output data-o="dur"></output></label>
    <label class="rng">Turn rate <input type="range" data-k="rot" min="0" max="120" step="5" value="40"><output data-o="rot"></output></label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Ragnarok's cast packet carries the skill, the target, the cast time and an element code. The element picks the colour [V, S46]. Its ground marker is one texture drawn before entities, turning at 40 degrees per second, 9 s per turn, sized from a per-skill table of 1, 5, 7 or 13 tiles [V, S47]. The circle here is built in code. It has an outer ring, 8 to 12 glyphs of 3x3 px, an inner ring and a polygon chosen by the element, flattened 2 to 1. It turns by moving the glyphs between 32 precomputed positions, never by rotating a bitmap [I]. The draw-in is the cast bar. Other players read who is casting, which element, how large and for how long. The orb at the hand climbs the ramp from dark to light as the cast fills and turns white only on the release frame. Slow rotation reads as charging and fast rotation reads as threat. A cast under 300 ms has no time for a draw-in [I].</figcaption>
</figure>
