<!--FIG doomfire-->
<figure class="fig" data-demo="doomfire" id="fig-doomfire">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">The DOOM PSX fire: one byte per pixel, one rule, 37 colours</h4></div>
  <div class="duo wide-l">
    <div><div class="stage click"><canvas width="160" height="120" aria-label="The DOOM PSX fire running on a 160 by 120 heat buffer; drag across it to blow the flames sideways"></canvas><div class="hud" data-hud></div></div></div>
    <div>
      <pre class="code" data-lang="per pixel"><code>p = fire[src]
if p == 0: fire[src - W] = 0
else:
    r   = round(random() * 3)   <span class="cm"># 0..3</span>
    dst = src - r + 1 + wind    <span class="cm"># +1..-2</span>
    fire[dst - W] = p - (r &amp; 1) <span class="cm"># -0 or -1</span></code></pre>
      <div class="readout" data-ro aria-live="polite"></div>
    </div>
  </div>
  <div class="ctl">
    <label class="rng">Decay chance <input type="range" data-k="pd" min="10" max="90" value="50"><output data-o="pd"></output></label>
    <label class="rng">Wind (px per row) <input type="range" data-k="wind" min="-20" max="20" value="0"><output data-o="wind"></output></label>
    <button type="button" class="btn" data-b="ext">Extinguish (bottom row to 0)</button>
    <button type="button" class="btn ghost" data-b="canon">Canonical values</button>
  </div>
  <div class="cmap-box"><canvas width="37" height="1" aria-label="The 37-entry DOOM fire palette, heat 0 on the left to 36 on the right; entries in use this frame are marked" data-pal></canvas></div>
  <p class="mini" style="margin:4px 0 0">The 37-entry palette, heat 0 (left) to 36 (right). The bar under it shows how many pixels use each entry this frame.</p>
  <div class="stage" style="margin-top:4px;background:#0c0807"><canvas width="370" height="28" data-hist aria-label="Histogram of heat values in the buffer"></canvas></div>
  <figcaption>Heat runs 0 to 36 and the bottom row is fixed at 36. Each pixel copies the one below into a column shifted by +1 to −2, minus <code>rand &amp; 1</code> <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s1">S1</a></span>. Because <code>round(random()*3)</code> is not uniform, decay happens half the time, flames reach about 72 rows and the fire leans left by about 0.5 px per row. That lean is the built-in wind <span class="cite"><b class="tag ti">I</b></span>. Raise the decay chance and the flames shrink, lower it and they fill the buffer. Drag across the fire to push it, or extinguish it and watch the flames die from the bottom up. The readout measures the mean flame height live.</figcaption>
</figure>
<!--/FIG-->
<!--FIG ancestors-->
<figure class="fig" data-demo="ancestors" id="fig-ancestors">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">The DOOM fire's ancestors on the same seed: Elias, Lode and Parusel</h4><span class="illu">Buffer sizes and palette illustrative</span></div>
  <div class="tri">
    <div><div class="stage click"><canvas width="96" height="72" aria-label="Hugo Elias fire with a scrolling cooling map; drag to paint a shape into the cooling map"></canvas><span class="tagl">Elias cooling map</span></div>
      <p class="pl"><code>p = avg4 − cool(x, y + off)</code>. <b>Drag</b> to paint a shape into the map.</p></div>
    <div><div class="stage"><canvas width="96" height="72" aria-label="Lode Vandevenne fire kernel"></canvas><span class="tagl">Lode kernel</span></div>
      <p class="pl"><code>(f[y+1][x−1] + f[y+1][x] + f[y+1][x+1] + f[y+2][x]) × 32 / 129</code></p></div>
    <div><div class="stage"><canvas width="96" height="72" aria-label="Adam Parusel fire, average of four neighbours minus one"></canvas><span class="tagl">Parusel avg − 1</span></div>
      <p class="pl"><code>(left + right + up + down) / 4 − 1</code>, checking 0 first.</p></div>
  </div>
  <div class="ctl">
    <label class="rng">Lode divisor <input type="range" data-k="div" min="400" max="500" value="403"><output data-o="div"></output></label>
    <label><input type="checkbox" data-k="map"> Show Elias's cooling map</label>
    <button type="button" class="btn ghost" data-b="clear">Clear painted shapes</button>
    <button type="button" class="btn ghost" data-b="seed">New seed</button>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>All three average neighbours, which is why they look soft next to the DOOM fire. Elias keeps a hidden map of how fast each spot cools, made by sprinkling points and smoothing about 20 times, and scrolls it up with the flames, so dark spots become tall tongues and shapes drawn into the map appear "created in flame" <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s8">S8</a></span>. Lode's divisor must be slightly larger than 4: exactly 4 rises forever and 5 dies far too fast <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s9">S9</a></span>. Parusel seeds the bottom two rows with 100 to 150 plus random 3×3 hotspots of 255 <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s10">S10</a></span>. Parusel's flames lose only 1 per row, so they are taller than this 72-row buffer. All three share one palette built from the study's six-step ramp, so only the rule differs.</figcaption>
</figure>
<!--/FIG-->
<!--FIG agetable-->
<figure class="fig" data-demo="agetable" id="fig-agetable">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Cheaper still: an age table that reads no neighbours, and fire from random samples</h4><span class="illu">Tables and colours illustrative</span></div>
  <div class="pair">
    <div><div class="stage"><canvas width="40" height="24" aria-label="Apple II style age-table fire, 40 cells wide"></canvas><span class="tagl">Age table, 40 wide</span><div class="hud" data-hud="a"></div></div>
      <p class="pl">Scroll up, set the bottom row white, then each cell with 50% chance becomes <code>table[c &amp; 7]</code>. Even entries go to black, so cells drop out and tongues form.</p></div>
    <div><div class="stage"><canvas width="64" height="64" aria-label="PICO-8 style Monte Carlo fire, random pixels updated each frame"></canvas><span class="tagl">Monte Carlo, 64×64</span><div class="hud" data-hud="b"></div></div>
      <p class="pl">Pick a random pixel, read <code>c = pget(x, y + rnd(2))</code>, <code>if rnd(50) &lt; c then c = t[c]</code>, draw a radius-1 circle. No full-screen pass.</p></div>
  </div>
  <div class="ctl">
    <label class="rng">Age step chance <input type="range" data-k="pc" min="10" max="90" value="50"><output data-o="pc"></output></label>
    <label class="rng">Samples per frame <input type="range" data-k="n" min="100" max="3000" step="50" value="900"><output data-o="n"></output></label>

    <label><input type="checkbox" data-k="fixed" checked> Fixed cost (share the samples)</label>
  </div>
  <div class="legend-mini" data-tab></div>
  <figcaption>Left, qkumba's 64-byte Apple II fire on a 40×48 screen, of which the bottom 24 rows are shown: 1 random step and 1 table lookup per cell, no neighbour reads <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s12">S12</a></span>. The table row under the pictures is the one used here. Right, kometbomb's 116-character PICO-8 fire with the PICO-8 colour numbers <span class="cite"><b class="tag tv">V</b> <a class="sref" href="#s13">S13</a></span>. With a fixed cost the number of updated pixels stays the same however many fires are on screen, so each fire gets fewer samples and flickers more <span class="cite"><b class="tag ti">I</b></span>. Untick it and the cost grows with the fires instead.</figcaption>
</figure>
<!--/FIG-->

<figure class="fig" data-demo="timeline" id="fig-timeline">

<figure class="fig" data-demo="flameloop" id="fig-flameloop">

  </div>
