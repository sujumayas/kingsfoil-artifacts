  <figcaption>The SNES wrote a horizontal offset per scanline from a sine table with HDMA [V, S24, S25]. The study's recipe is <code>offset_x(row) = round(A · sin(row·0.5 + t·6) · falloff(row))</code> with A = 1 px at 320x180 [I, notes 08 and 09]. Untick whole pixels to see why sub-pixel offsets are a risk: they blend neighbours and shimmer [I]. Dracula X's fire wobbles one layer sideways and another up and down (a forum reconstruction) [V, S27]. In Godot, offset the fire's own texture rather than reading the screen, because of open Compatibility bugs [V, S121].</figcaption>
