  <figcaption>Stardew bobs a swimmer with <code>yOffset = cos(t_ms / 2000) × 4</code>, 4 px at 4x zoom, so 1 art pixel [V, S107]. The study's values are 1 px at 320x180, since 2 px reads as bouncing; a period of 1.5 to 2.5 s for small items and 3 to 4 s for logs and boats; a phase from <code>hash(id)</code>; and a drift of 4 to 8 px/s along the tile flow that stops at shore tiles [I, notes 06, 08]. Floating items are clipped at a waterline like wading sprites. Bobbing is the motion most likely to bother sensitive players, so keep it to 1 px and let an option freeze it [V, S138; I, note 06].</figcaption>
</figure>

<!--FIG heightfield-->
<figure class="fig" data-demo="heightfield" id="fig-heightfield">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">A lake-size heightfield next to a ring pool: interference and bounces, at a price per cell</h4><span class="illu">Drop size and lake shape illustrative</span></div>
  <div class="pair">
    <div><div class="stage click"><canvas width="80" height="45" aria-label="An 80 by 45 cell heightfield lake with ripples spreading, crossing and bouncing off the shore; click to drop"></canvas><div class="hud" data-hud></div></div><p style="margin:6px 0 0;font-size:13px;color:var(--mute);line-height:1.45">Elias two-buffer ripple, 80 × 45 cells.</p></div>
    <div><div class="stage click"><canvas width="160" height="90" aria-label="The same lake with one ring sprite per drop"></canvas></div><p style="margin:6px 0 0;font-size:13px;color:var(--mute);line-height:1.45">Ring pool, same drops, same speed.</p></div>
  </div>
  <div class="ctl">
    <div class="seg" data-seg="hz" role="group" aria-label="Simulation rate"><button type="button" data-v="10">10 Hz</button><button type="button" class="on" data-v="15">15 Hz</button><button type="button" data-v="30">30 Hz</button></div>
    <label class="rng">Damping <input type="range" data-k="damp" min="850" max="995" step="5" value="970"><output data-o="damp"></output></label>
    <label><input type="checkbox" data-k="auto" checked> Auto drops</label>
    <button type="button" class="btn ghost" data-b="calm">Calm the lake</button>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Each cell becomes <code>(N + S + E + W) / 2 − old</code>, then shrinks by the damping; ports use 0.99 and 0.9 [V, S76, S77]. That is the leapfrog wave equation at r² = 1/2, right on the 2D stability limit, so rings always travel 0.707 cells per tick [I, note 05]. At 30 ticks/s on 4 px cells they grow about 85 px/s, too fast for a calm lake, so run it at 10 to 15 Hz. Integer damping <code>h −= h &gt;&gt; n</code> gives 0.969 at n = 5 and 0.9375 at n = 4 [I, note 05]. The grid costs the same when the lake is calm; the ring pool costs nothing [I, note 08].</figcaption>
</figure>

  </div>
  <svg class="chart" viewBox="0 0 400 142" role="img" aria-label="Log-scale line of how many particles are alive over the last 10 seconds, against the 57,600 cells a 320 by 180 grid touches every tick" style="margin-top:8px;max-width:560px"></svg>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Yuksel, House and Keyser's wave particles (SIGGRAPH 2007) are "simple, fast, and unconditionally stable": every disturbance launches moving bumps and objects make new waves by moving [V, S81]. Each particle stores origin, position, direction, amplitude, spread angle and birth time, and splits into three at one third amplitude when its neighbours drift apart [I, note 05]. Dots here are coloured by the height of their front. The 2D port is a CPU array of a few hundred dots with a palette index by amplitude and no heightfield, while a 320x180 grid touches 57,600 cells every tick, even when calm [I, note 05]. No shipped game is named on the project page [V, S81].</figcaption>
</figure>
