<!--FIG stardew-->
<figure class="fig" data-demo="stardew" id="fig-stardew">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Stardew tufts sleep until touched, then shake and settle in under a second: smooth rotation against three baked lean frames</h4><span class="illu">Tufts drawn for this page</span></div>
  <div class="duo">
    <div><div class="stage"><canvas width="96" height="52" aria-label="Tufts rotated smoothly at native resolution as a walker passes; the rotated pixels break into jagged mixels"></canvas><span class="tagl">Smooth rotation</span></div></div>
    <div><div class="stage"><canvas width="96" height="52" aria-label="The same tufts using three baked frames, lean left 1 pixel, upright, lean right 1 pixel"></canvas><span class="tagl">3 lean frames</span></div></div>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Each tile holds 4 tufts offset by −2 to +2 px and flipped half the time, seeded per tile so the layout never changes [V, S37]. They never sway in wind. Touched, a tuft rotates back and forth at <code>π/80</code> per tick while its maximum, <code>π/8</code>, shrinks by <code>π/350</code> per tick; then the rotation halves each tick and below 0.01 rad the tuft stops updating [V, S36]. Each tuft divides by <code>1 + r</code>, r in [0, 1), so neighbours bend 50% to 100% as much. That is a 22.5° peak and about 44 ticks, 0.73 s at 60 ticks/s [I]. Left, the rotation at native resolution: the pixels jitter into mixels, fine at Stardew's 4× but not at 320×180 [I]. Right, the same state machine picks one of three frames, left 1 px, upright or right 1 px (C5). As one instanced batch, 2,000 tufts measured 0.012 ms on the M4 GPU at 320×180 (§6a; the A4 profile quotes the 0.015 ms wall figure) [V, S12].</figcaption>
</figure>
<!--/FIG-->
<!--FIG highgrass-->
<figure class="fig" data-demo="highgrass" id="fig-highgrass">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Roguelike high grass blocks sight like a wall; step in and it tramples flat and the view opens</h4><span class="illu">Map drawn for this page</span></div>
  <div class="stage click mid"><canvas width="160" height="96" aria-label="A dungeon room of 8 pixel cells with patches of high grass; the hero's field of view stops at the grass, and every cell the hero steps on becomes short grass"></canvas><span class="tagl">Tap a cell to walk there</span></div>
  <div class="ctl">
    <label><input type="checkbox" data-k="auto" checked> Explore on its own</label>
    <label><input type="checkbox" data-k="regrow"> Brogue regrowth, 1% per turn</label>
    <button type="button" class="btn ghost" data-b="reset">Regrow everything</button>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Shattered Pixel Dungeon defines <code>HIGH_GRASS = PASSABLE | LOS_BLOCKING | FLAMABLE</code>, and each cell's <code>losBlocking</code> feeds the same shadowcaster as walls [V, S73, S74]. Stepping in sets plain grass and bursts 4 leaf particles; the game recomputes the FOV only if that cell is in the hero's view [V, S72]. Brogue's foliage promotes on step to trampled foliage that regrows at 1% per turn, about 100 turns on average [V, S75]. So you hide behind grass, never inside it, and the trampled cells show where you went [I]. Our view uses a simple ray test with radius 8, not SPD's shadowcaster. In an MMO each step would change FOV for everyone near, so use the server rule of E4 there [I].</figcaption>
</figure>
<!--/FIG-->

<figure class="fig" data-demo="hashvar" id="fig-hashvar">

  </div>

  <figcaption>Four 16×16 variants: nearly flat, light clusters, dense clusters and an occasional flower tile, with clusters that wrap at the tile edges, as Slynyrd advises [V, S149, S150]. "A good texture may only need a few simple clusters." <code>hash(x, y)</code> picks the variant and whether to mirror it, like Stardew's per-tile seed [V, S37]. Godot terrain painting picks matching variants at random, unseeded by a user function, so in an MMO each client could paint a different field [V, S107; I, note 08]: switch to <b>Engine random</b> and reconnect client B. The mood map is a slow world-space noise that picks ramp A, B or C per pixel, with world-locked Bayer at the seams (Fog C1) [V, S112; I, note 08]. Drag to pan; the pattern stays on the ground. Baked into the tilemap it costs nothing per frame; as a shader it is one hash and one palette lookup per pixel, comparable to the 0.0021 ms full-screen pass at 320×180 on the M4 GPU [V, S12]. Zero network bytes.</figcaption>
</figure>

  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Terraria computes <code>phase = x*0.5 + (y/100)*0.5</code> and <code>s = cos(counter*2π + phase) * 0.5 + WindForVisuals</code>, then scales by <code>lerp01(0.08..0.18, |wind|)</code> [V, S52]. From those numbers: a calm period of 180 frames (3.0 s) and a storm period of 36 frames (0.6 s), a wavelength of 12.6 tiles (about 201 px at 16 px tiles), and crests that move about 67 px/s calm and 335 px/s in a storm [I]. The <code>+0.5x</code> term moves crests toward −x whatever the wind's sign: set the wind positive and watch the crest go upwind. For Asterion use <code>phase = dot(tile, wind_dir) * k − ωt</code> so crests travel downwind (§7) [I]. Below a threshold Terraria keeps sway nearly zero; our gate fades in between |wind| 0.06 and 0.2, a value we picked. Our tufts lean in whole pixels instead of Terraria's float rotation. As a shader term it is part of the 0.0021 ms field pass or the instanced tuft draw [V, S12].</figcaption>
</figure>
