  <figcaption>Blue is tip height, gold is the crush η and dashed green is the recovery factor. Jahrmann and Wimmer move the tip by <code>(r + g + w)·dt + d</code>, with the collision push <code>d</code> not scaled by dt [V, S119]. Crush fades as <code>η = max(η − a·dt, 0)</code>, each push adds its squared length, and recovery is <code>r = (rest − tip)·s·max(1 − η, 0.1)</code> [V, S119]. Push η above 1 and untick the floor, and the tuft stays flat until η drops back under 1. With the floor it always creeps up at 10%. Wind sway here is scaled by <code>(1 − η)</code>, as the 2D port suggests [I]. Their test ran 397,881 blades on a GTX 780M in 8.13 ms per frame, 0.547 ms of it physics [V, S119].</figcaption>

  <figcaption>Helbing's ground comfort is <code>dG/dt = (G0 − G)/T + I(1 − G/Gmax)·Σ steps</code>, with T the durability, I the footprint and Gmax saturation [V, S122]. Walkers here lean toward worn ground ahead, which is the trail attraction that turns many routes into a few shared paths. <code>κ = I·T/σ²</code> sets direct paths against a network, and the paper gives no numbers [V, S122]. The step counter is the Step Erosion mod, dirt after 20 steps and path after 50, reverting after 72 h idle [V, S67, S68]. On a server, G is one byte per tile, ticked once a minute, with a 9-byte update only when a tile crosses a stage [I]. Busy towns need unique walkers per hour, or a square turns to mud in minutes [I].</figcaption>

    <div style="flex:0 0 112px"><div class="stage"><canvas width="28" height="7" aria-label="The halo atlas: four frames from a bright core with a plus and dithered diamond down to a dim core"></canvas></div></div>
    <p style="flex:1 1 200px;margin:0;font-size:12px;color:var(--mute);line-height:1.4">The atlas. Core, a plus one step down, a 50% diamond two steps down, then each frame fades a step.</p>
  </div>
  <div class="ctl">
    <div class="seg" data-seg="m" role="group" aria-label="Glow method"><button type="button" class="on" data-v="sprite">Halo sprites</button><button type="button" data-v="radial">Per-pixel radial</button><button type="button" data-v="light">One light each</button></div>
    <label class="rng">Fireflies <input type="range" data-k="n" min="10" max="200" step="10" value="40"><output data-o="n"></output></label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Godot's GLES3 canvas lets one item take at most 15 lights, and a render 256 [V, S103]. Give each firefly a light and the ones past 15 simply go dark, popping as the sort order changes. Additive halos also overlap into off-palette white [I]. Halo sprites in palette steps with normal alpha keep every colour legal, which the off-palette count shows [I]. On the CPU a radial loop measured faster than sprite draws, 0.052 ms against 0.19 ms for 200 [V, S12], but it fills the edge with colours the palette never had. To light the grass as well, stamp one texel per firefly into the light map instead [S6; I, note 06].</figcaption>
</figure>

<!--FIG critters-->
<figure class="fig" data-demo="critters" id="fig-critters">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Rabbit, frog and cricket: a slow threat check and a scripted escape</h4><span class="illu">Radii are the Kingsfoil table's scaling; layout illustrative</span></div>
  <div class="stage click"><canvas width="192" height="112" aria-label="A meadow with a bush, a pond and a patch of tall grass; a rabbit nibbles and bolts for the bush when the walker comes near, a frog leaps into the pond, and cutting the tall grass flushes crickets"></canvas><div class="hud" data-hud></div></div>
  <div class="ctl"><label><input type="checkbox" data-k="rings" checked> Show flee rings and checks</label></div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Stardew's rabbits poll every 200 ms and dive into a bush, and frogs leap with about 0.8 s of air and 1.1 tiles of height [V, S41, S42; I]. DST adds hysteresis, flee within one radius and stop only past a larger one [V, S79]. The rings show the Kingsfoil table, a rabbit fleeing inside 4 tiles and stopping past 8, a frog at 3 [I, note 07]. Those are the researcher's scaling, not shipped values. Crickets come out of cut grass, as Terraria's grasshoppers and BotW's crickets do [V, S58, S164], and walking through tall grass flushes one 1 to 3% of the time with a cooldown [I]. A white dot blinks at each check. Nothing here uses pathfinding.</figcaption>
</figure>

  <div class="stage"><canvas width="192" height="108" aria-label="Dandelion clocks on a meadow shed seeds that drift downwind and sink toward their shadows, while pollen specks and pink petals float across as the camera pans"></canvas><div class="hud" data-hud></div></div>

    <div class="seg" data-seg="wrap" role="group" aria-label="Wrap space"><button type="button" class="on" data-v="world">Wrap in world space</button><button type="button" data-v="screen">Screen space</button></div>
    <button type="button" class="btn" data-b="gust">Gust</button>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>A dandelion seed falls at 39.1 cm/s [V, S141], about 12 px/s at 32 px per metre. From 1 m it lands in about 2.5 s, about 2.5 tiles downwind in a 1 m/s breeze [I]. Each seed sinks toward a 1 px shadow, and now and then one catches a lift, like Stardew's 0.1% "blowing" state [V, S48]. Stardew moves each debris particle by <code>dx + globalWind</code> and <code>dy + 0.5</code> per update [V, S48]. Pollen and petals wrap around the world, so the count never changes. Switch to screen space while the camera pans and they slide with the camera, the anti-pattern [I].</figcaption>

  <figcaption>Stardew caps critters at 10 per location, 20 in summer, spawns none in rain, keeps butterflies to spring and summer before 15:00 and brings a second critter within 2 tiles 40% of the time [V, S45]. Here rain still leaves frogs, as in the Sandbox [S11]. Terraria sends no flyers in wind over 20 mph [V, S55, S57]. Creatures spawn on features that explain them, flowers, reeds, lamps and a bush, just outside the camera, and despawn once they leave the range. The pool is a fixed row of slots, so nothing allocates. Seed each spawn from <code>hash(chunkX, chunkY, timeBucket, worldSeed)</code> with 30 to 60 s buckets and every client agrees [I].</figcaption>
