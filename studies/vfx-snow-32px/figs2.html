<!--FIG bayer32-->
<figure class="fig" data-demo="bayer32" id="fig-bayer32">

    <div><div class="stage"><canvas width="96" height="64" aria-label="Three by two grass tiles of 32 px with a 24 by 32 px character. The same dot pattern of snow lies over them, four times finer than the tile art, like a screen door"></canvas></div><p class="pl"><b>32 px tiles.</b> The same matrix at the same level. The dots are 1/32 of a tile and sit on the art like a screen door.</p></div>
  </div>
  <div class="ctl">
    <label class="rng">Coverage level <input type="range" data-k="lv" min="1" max="16" step="1" value="4"><output data-o="lv"></output></label>
    <label><input type="checkbox" data-k="b8"> Bayer 8x8</label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Both panels show 3 by 2 tiles and the gold corners mark one tile. A 4x4 Bayer matrix repeats 2 times across an 8 px tile and 8 times across a 32 px tile. At level 1/16 it leaves 64 isolated pixels on a 32 px tile and at 4/16 it leaves 256 [I, notes 11, 12]. The readout counts them in the pattern. cure says pixels outside a cluster "expose the underlying grid", and Derek Yu says to draw nothing one pixel thick [V, S97, S98]. Bayer 8x8 moves the dots and keeps the count at the low levels. The flat Bayer pass is the cheapest ground render in the study. Dither still works in a band 2 to 3 px wide at the edge of a solid patch [I, note 11].</figcaption>
</figure>
<!--/FIG-->
<!--FIG artmap-->
<figure class="fig" data-demo="artmap" id="fig-artmap">

    <div><div class="stage"><canvas width="96" height="72" aria-label="Grass tiles where snow starts as small rounded blobs between the grass tufts and grows into merged patches with a light rim and a shadow line"></canvas><div class="hud" data-hud="a"></div></div><p class="pl"><b>Art map.</b> Hollows fill first and tuft tips drown last. Every patch is built from 2x2 px blocks.</p></div>
    <div><div class="stage"><canvas width="96" height="72" aria-label="The same grass tiles and the same depth drawn through a Bayer matrix plus noise. The snow arrives as scattered single pixels"></canvas><div class="hud" data-hud="b"></div></div><p class="pl"><b>Bayer 4x4 plus noise.</b> The VFX #1 matrix on the same depth field, stretched over the same 4 to 55 units.</p></div>
  </div>
  <div class="ctl">
    <label class="rng">Depth <input type="range" data-k="d" min="0" max="80" step="1" value="26"><output data-o="d"></output></label>
    <label><input type="checkbox" data-k="fr" checked> Frost tint from depth 4</label>
    <div class="seg" data-seg="view" role="group" aria-label="View"><button type="button" class="on" data-v="snow">Snow</button><button type="button" data-v="map">Threshold map</button></div>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Drag the depth slider. On the left about 6 seed blobs per tile appear in the hollows, grow, merge and close around the tufts last. The Sandbox stores this order in one 128x128 px tileable map with ranks from about 4 to 55 units, in 2x2 px blocks [V, S3]. The test is the same compare as Bayer, <code>depth &gt; threshold</code>, so the engine still stores one byte per cell. With the frost tint on, bare ground turns pale blue from depth 4, so the thinnest cover is a colour and not a speckle [V, S97; I, note 11]. In our edge test the longest straight run on the snow boundary was 13 px with a cluster tile and 41 to 43 px with Bayer 4x4 [V, S5]. The depth here is one smooth field sampled per 2 px, as the 1:2 field of the Sandbox does. The right side is the VFX #1 matrix stretched over the same 4 to 55 units, so both sides fill at the same rate. No shipped game was found that thresholds a depth field against a painted map.</figcaption>
</figure>
<!--/FIG-->
<!--FIG maskblend-->
<figure class="fig" data-demo="maskblend" id="fig-maskblend">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Summer and winter tiles blended per pixel through the threshold</h4><span class="illu">This study's proposal, no shipped precedent found</span></div>
  <div class="pair">
    <div><div class="stage"><canvas width="128" height="96" aria-label="A small atlas in three rows of four tiles. The top row is summer art with grass, a dirt path and flagstones. The middle row is the same four tiles drawn by hand in winter. The bottom row is the threshold map in grey"></canvas><div class="hud" data-hud="a"></div><div class="hud" data-hud="b" style="top:35%"></div><div class="hud" data-hud="c" style="top:68%"></div></div><p class="pl"><b>The atlas.</b> Each winter tile sits at a fixed offset from its summer twin. The third row is the threshold map.</p></div>
    <div><div class="stage"><canvas width="128" height="96" aria-label="A map of four by three tiles with grass, a dirt path and a flagstone yard. Winter art shows through in growing patches as the depth rises"></canvas></div><p class="pl"><b>The blend.</b> <code>depth &gt; threshold ? winter : summer</code>, once per pixel.</p></div>
  </div>
  <div class="ctl">
    <label class="rng">Depth <input type="range" data-k="d" min="0" max="90" step="1" value="20"><output data-o="d"></output></label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>The map is drawn twice. The summer row has grass, a dirt path and flagstones. The winter row is the same four tiles drawn by hand, with drift lines, dry grass, a trodden path with boot prints and stones under snow. For each pixel the shader reads the depth field, the threshold, the summer tile and the winter tile, and depth against threshold picks one of the two. That is 4 fetches per pixel and 921,600 per frame at 640x360 [I, note 12]. Coverage stays dynamic and every pixel on screen is drawn by an artist. finalbossblues ships winter tiles "in the exact same arrangement as the originals", which is the atlas layout this needs [V, S110]. It is untested in Godot, and atlas padding or tile animation may break the fixed offset [I, note 12].</figcaption>
</figure>

<figure class="fig" data-demo="overlay" id="fig-overlay">

  <div class="stage click" style="max-width:642px"><canvas width="160" height="96" aria-label="A map of five by three tiles with grass, a dirt path, a pine and a rock. The buttons show it in summer, fully swapped to winter art, with a snow overlay on some tiles, or with half-snowed grass tiles around full snow"></canvas><div class="hud" data-hud></div></div>
  <div class="ctl">
    <div class="seg" data-seg="mode" role="group" aria-label="Method"><button type="button" data-v="summer">Summer</button><button type="button" class="on" data-v="swap">Swap</button><button type="button" data-v="over">Overlay</button><button type="button" data-v="half">SnowGrass</button></div>
    <button type="button" class="btn ghost" data-b="reset">Reset tiles</button>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>These are the methods that shipped. "Swap" replaces every tile with its winter twin in one event, as Stardew does with season-prefixed tilesheets, and the pine and the rock change to their snowy items as Tibia's do [V, S2, S9]. "Overlay" lays a transparent snow layer with hand-drawn edges over any ground, as Mana Seed's snow autotile does [V, self-reported, S107]. Click a tile to add or remove it. "SnowGrass" adds a half-way ground between grass and snow, as Time Fantasy does [V, self-reported, S109]. Click a tile to step it through grass, SnowGrass and snow. All three are free at run time and all three change in whole tiles, so the snow line moves 32 px at a time [I]. Every commercial winter set we reached is drawn at 16 px [V, self-reported, S111; I, note 17].</figcaption>
</figure>

  <figcaption>Drag the slider from 0. On the left the roof fills from the ridge down in scallops, then a lip appears that covers the eave line and hangs 2 rows over the wall, with a thickness band 3 px tall. Each pine tier gets its own cap, which starts at the visible top of the tier and grows down to about 60% of it, and the dark fringe stays free [V, S3]. On the right the same pixels are tested against Bayer plus noise. Both sides run one compare per cap pixel, so the shape itself costs nothing at run time. It lives in a static map that is drawn once. The edge shading on the left reads up to 6 neighbours per snow pixel, and the readout times both sides in this browser. The report's thickness scale is 2 px for a dusting, 3 to 4 px for normal snow and 5 to 6 px for heavy snow, because a 1 px cap vanishes next to a 1 px outline [V, S98; I, note 11]. The first rows of each cap here are thinner than that for a few depth units. No tutorial with px numbers for roof snow or pine tiers was found, so every value here was judged by eye [V, S102, S103].</figcaption>

<!--FIG artmask-->
<figure class="fig" data-demo="artmask" id="fig-artmask">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">A coarse exposure map under an eave, with and without the static art mask</h4><span class="illu">Scene and depth illustrative</span></div>
  <div class="pair">
    <div><div class="stage"><canvas width="104" height="72" aria-label="The baked exposure map of a house corner as coloured cells. Light cells are open to the sky and dark cells are sheltered. At 1 to 4 the cells are 4 px blocks that straddle the eave line"></canvas><div class="hud" data-hud="a"></div></div><p class="pl"><b>The baked map.</b> Light is open sky, dark is shelter. One value per field cell.</p></div>
    <div><div class="stage"><canvas width="104" height="72" aria-label="The same house corner drawn from that map. Without the mask the snow smears over the eave line and the wall in a ragged band. With the mask the eave edge and the roof outline are crisp"></canvas><div class="hud" data-hud="b"></div></div><p class="pl"><b>Drawn from it.</b> Snow on the roof, a dry strip under the eave, open snow beyond.</p></div>
  </div>
  <div class="ctl">
    <div class="seg" data-seg="r" role="group" aria-label="Map resolution"><button type="button" data-v="1">1:1</button><button type="button" data-v="2">1:2</button><button type="button" class="on" data-v="4">1:4</button></div>
    <label><input type="checkbox" data-k="mask"> Static art mask</label>
    <label class="rng">Depth <input type="range" data-k="d" min="40" max="120" step="1" value="100"><output data-o="d"></output></label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>The exposure map is baked at field resolution and sampled bilinearly. At 1:4 a cell is 4 px wide and straddles the eave, so roof snow smears onto the wall and the outline, and the roof edge loses its lip. The report puts the soft band at 2 px for 1:2 and 4 px for 1:4, the width of one cell [I, note 12; V, S3]. The readout counts how far the snow reaches below the eave line in this scene. Tick "Static art mask". The tileset now carries a mask at art resolution with the roof outline in it. The shader multiplies it into the sampled depth, and each pixel mixes only cells of its own surface class, so roof snow never bleeds onto the wall or the ground. The mask never changes, so it costs no upload and one alpha read from a texture the shader already samples [I, note 12]. The coarse map is what makes the bakes cheap. A static mask cannot follow a cart or a tent [I].</figcaption>
</figure>

  <figcaption>RPG Maker VX Ace draws a 6x6 px flake on 32 px tiles, MV and MZ draw 9x9 px on 48 px tiles and Stardew's winter debris is 12 px on a 64 px tile. All three are 0.1875 of a tile [V, S27, S18, S26, S30]. The count did not follow the tile. Both RPG Makers stop at 90 flakes. Peak coverage is 1.27% of screen pixels in VX Ace, 0.89% in MV and 1.03% in the VFX #1 sandbox, which is where the 1% rule comes from [I, note 14]. The Sandbox runs 560 far flakes of 1 px, 300 mid flakes of 2 px and 150 near flakes of 3 px on 640x360, and measured 0.9 to 0.97% [V, S3]. "1 px only" is the VFX #1 look at this scale. A 1 px flake is 1/32 of a tile and the Sandbox measured 0.39% [V, S3]. "Large" adds the 6 px near flakes that the shipped engines use. The rule rests on three data points, so it is a tuning target and not a law [I, note 14].</figcaption>
