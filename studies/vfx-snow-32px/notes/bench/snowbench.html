<body>
<pre id="out">Snow at 32 px benchmark. Call runCPU({only:'regex'}) or await runGPU({only:'regex'}) from the console or Playwright.</pre>
<script>
"use strict";
// ---------------- harness (same shape as studies/vfx-magic/notes/bench/magicbench.html) ----------------
// Each sample runs fn until minSampleMs has passed and stores the mean ms per call. The median and p95 are over the samples.

}
let SINK = 0;
function sync(cx) { SINK += cx.getImageData(0, 0, 1, 1).data[1]; }

// ---------------- RNG / hash / noise (copied from studies/vfx-snow/sandbox.html) ----------------

const RS = new Int32Array([1234567]);

const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];

// ---------------- palette (copied from the sandbox: 58 base colours x 4 variants) ----------------
const BASE = []; const C = h => { BASE.push(h); return BASE.length - 1; };
const GR_D = C('#2f4a3c'), GR_A = C('#3b5a45'), GR_B = C('#4a6b4b'), GR_T = C('#5f7f52'),
  DIRT_A = C('#6a5140'), DIRT_B = C('#5b4536'), ICE_A = C('#8fb6d6'), ICE_B = C('#a9cbe4'), ICE_C = C('#d7ecfa'),
  SN_HI = C('#f6f9ff'), SN_BASE = C('#e2eaf6'), SN_MID = C('#c4d1ea'), SN_SH = C('#9eaedb'), SN_DEEP = C('#7c86c2'), SN_PACK = C('#c9cfe2'), SN_PSH = C('#a6aecf'), SPARK = C('#ffffff'),
  ROOF_A = C('#8a3b3b'), ROOF_B = C('#6e2c31'), ROOF_D = C('#4a1f27'), WALL_A = C('#8b6a4a'), WALL_B = C('#7a5b3f'), WALL_D = C('#4d3826'), DOOR = C('#3d2a1d'), WIN = C('#7f9fbf'),
  CHIM = C('#77727a'), CHIM_D = C('#55505a'), CAN_A = C('#2f6b4f'), CAN_B = C('#24553f'), CAN_D = C('#1a3d30'), TRUNK = C('#5a3b28'),
  ROCK_A = C('#8a8f9a'), ROCK_B = C('#6f7480'), ROCK_C = C('#4e525d'), FEN_A = C('#9a7650'), FEN_D = C('#6a4d33'), LAMP_P = C('#2c2a33'), LAMP_L = C('#ffd27a'),
  HAT = C('#c8443c'), HATB = C('#efe6dc'), SKIN = C('#f0c09a'), EYE = C('#2a1b22'), SCARF = C('#f2c14e'), COAT = C('#3c6fb4'), COAT2 = C('#2f5592'), LEG = C('#2a2c3a'), BOOT = C('#5a3a28'),
  V_HAT = C('#6b4a2f'), V_HATB = C('#4a321f'), V_COAT = C('#4f7a3a'), V_SCARF = C('#b8423f'),
  FOX = C('#d9733a'), FOX_W = C('#f3e7da'), FOX_D = C('#3a2a24'), FLAKE = C('#ffffff'), FLAKE_F = C('#c9d6ee'), SMOKE = C('#b9bcc7'), BREATH = C('#e8eef8');

  const S = new Uint8Array(NP), B = new Uint8Array(NP), Hgt = new Uint8Array(NP), O = new Int16Array(NP).fill(-1), WOB = new Uint8Array(NP), Cm = new Uint8Array(NP), thr = new Float32Array(NP), Lm = new Float32Array(NP), SHL = new Float32Array(NP).fill(1);

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const dx = (x - 258) / 34, dy = (y - 156) / 14, r = dx * dx + dy * dy; if (r < 1) { const i = y * W + x; S[i] = ICE;

      r = Object.assign({ name }, stats(slopes), { K, sync_ms: +m1.toFixed(3) });
      const js = []; for (let s = 0; s < 11; s++) { const a = performance.now(); for (let k = 0; k < K; k++) drawOnce(k); js.push((performance.now() - a) / K); syncGL(); } r.js_ms = stats(js).median_ms; r.js_p95_ms = stats(js).p95_ms;
      if (tq) { const tqs = []; const KT = Math.max(Math.min(K, 400), 20); for (let s = 0; s < 5; s++) tqs.push((await timerQuery(drawOnce, KT)) / KT); const ok = tqs.filter(x => !isNaN(x)); if (ok.length) r.timer_query_ms = +stats(ok).median_ms.toFixed(5); }
      if (typeof extra === 'function') extra = extra(); Object.assign(r, extra || {});
    } catch (e) { r = { name, error: String(e && e.stack || e) }; console.error(name, r.error); }
    out.results.push(r); console.log(name, r.median_ms, r.js_ms, r.timer_query_ms ?? ''); await new Promise(r => setTimeout(r, 0)); }

  // static textures
  const artTex = {}; function artT(AW) { if (artTex[AW]) return artTex[AW]; const w = world(AW), d = new Uint8Array(w.NP * 4); for (let i = 0; i < w.NP; i++) { const c = pal[w.B[i]]; d[i * 4] = c & 255; d[i * 4 + 1] = (c >> 8) & 255; d[i * 4 + 2] = (c >> 16) & 255; d[i * 4 + 3] = holds(w.S[i]) ? 255 : 0; } return artTex[AW] = mkTex(w.W, w.H, 'RGBA8', d, gl.NEAREST); }
  const thrBayer = mkTex(4, 4, 'R8', BAYT, gl.NEAREST, gl.REPEAT), thrArt = mkTex(32, 32, 'R8', TT.subarray(0, 1024), gl.NEAREST, gl.REPEAT), bayRaw = mkTex(4, 4, 'R8', new Uint8Array(BAYER), gl.NEAREST, gl.REPEAT);
  const palD = new Uint8Array(8 * 2 * 4); [SN_HI, SN_BASE, SN_SH, SN_PACK, SN_PSH, SPARK, SN_MID, SN_DEEP].forEach((ci, i) => { for (let row = 0; row < 2; row++) { const c = pal[ci + row * N], o = (row * 8 + i) * 4; palD[o] = c & 255; palD[o + 1] = (c >> 8) & 255; palD[o + 2] = (c >> 16) & 255; palD[o + 3] = 255; } });
  const palTex = mkTex(8, 2, 'RGBA8', palD, gl.NEAREST);
  const fldTex = {}; function fieldT(Wd, which, filt) { const k = Wd + which + filt; if (fldTex[k]) return fldTex[k]; const w = world(Wd); return fldTex[k] = mkTex(w.W, w.H, 'R8', w[which], filt); }
  function setup(P, RW, RH, AW, FWd, filt, thrKind) { const F = world(FWd), T = fbo(RW, RH); gl.bindFramebuffer(gl.FRAMEBUFFER, T.fb); gl.viewport(0, 0, RW, RH); gl.useProgram(P.p);
    bind(0, artT(AW)); bind(1, fieldT(FWd, 'D0', filt)); bind(2, thrKind === 'art' ? thrArt : thrBayer); bind(3, palTex); bind(4, fieldT(FWd, 'P0', filt)); bind(5, fieldT(FWd, 'Wt0', filt)); bind(6, fieldT(FWd, 'SH', gl.NEAREST)); bind(7, bayRaw);
    gl.uniform2f(P.U.fres, F.W, F.H); gl.uniform1f(P.U.thrSize, thrKind === 'art' ? 32 : 4); gl.uniform1f(P.U.nf, .71); gl.uniform2f(P.U.lampPos, RW * .74, RH * .46); gl.uniform2f(P.U.lampR, RW * .106, RH * .11); gl.bindVertexArray(fullVAO); }

  // 3a. the ground pass as one full-screen fragment shader
  for (const [RW, RH, AW] of [[640, 360, 640], [960, 540, 960], [1920, 1080, 640]]) { const tag = `${RW}x${RH}`;
    const Gs = (id, prog, fr, filt, thrKind, taps) => gpuBench(`glground/${tag}/${id}`, () => { const P = PF[prog]; setup(P, RW, RH, AW, AW / fr, filt === 'linear' ? gl.LINEAR : gl.NEAREST, thrKind); return k => { gl.uniform1f(P.U.slot, k & 63); gl.uniform1f(P.U.tm, k / 60); gl.drawArrays(gl.TRIANGLES, 0, 3); }; }, { pixels: RW * RH, texture_reads_per_pixel_max: taps, field: `${AW / fr}x${Math.round(AW / fr * 9 / 16)}` });
    await Gs('flat-f1-nearest-bayer', 'flat', 1, 'nearest', 'bayer', 3);
    await Gs('flat-f2-nearest-bayer', 'flat', 2, 'nearest', 'bayer', 3);
    await Gs('flat-f2-linear-art', 'flat', 2, 'linear', 'art', 3);
    await Gs('emboss-f1-nearest-art', 'emboss', 1, 'nearest', 'art', 8);
    await Gs('emboss-f2-linear-art', 'emboss', 2, 'linear', 'art', 8);
    await Gs('emboss-f4-linear-art', 'emboss', 4, 'linear', 'art', 8);
    await Gs('full-f1-nearest-art', 'full', 1, 'nearest', 'art', 11);
    await Gs('full-f2-linear-art', 'full', 2, 'linear', 'art', 11);
    await Gs('full-f4-linear-art', 'full', 4, 'linear', 'art', 11);
    await Gs('fullflakes-f2-linear-art', 'fullflakes', 2, 'linear', 'art', 11);
  }

  // 3b. texSubImage2D upload cost. Each timed frame = the upload(s) + a 1x1 px draw that samples the texture, so the upload must land. upload/none is that draw alone.
  { const P = PF.flat; const prep = tx => { const T = fbo(64, 64); gl.bindFramebuffer(gl.FRAMEBUFFER, T.fb); gl.viewport(0, 0, 1, 1); gl.useProgram(P.p); bind(0, artT(640)); bind(2, thrBayer); bind(1, tx); gl.uniform1f(P.U.thrSize, 4); gl.bindVertexArray(fullVAO); };
    const dummy = mkTex(64, 64, 'R8', new Uint8Array(4096), gl.NEAREST);
    await gpuBench('upload/none (1 px draw only)', () => { prep(dummy); return () => gl.drawArrays(gl.TRIANGLES, 0, 3); }, { bytes: 0 });
    for (const [w, h] of [[160, 90], [320, 180], [640, 360]]) for (const fmt of ['R8', 'RGBA8']) { const bpp = fmt === 'R8' ? 1 : 4, GF = fmt === 'R8' ? gl.RED : gl.RGBA;
      const mkd = () => { const d = new Uint8Array(w * h * bpp); for (let i = 0; i < d.length; i++) d[i] = Math.imul(i, 2654435761) >>> 24; return d; };
      await gpuBench(`upload/${w}x${h}/${fmt}/full`, () => { const d = mkd(), tx = mkTex(w, h, fmt, d, gl.NEAREST); prep(tx); return k => { d[(k * 97) % d.length] ^= 1; gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, GF, gl.UNSIGNED_BYTE, d); gl.drawArrays(gl.TRIANGLES, 0, 3); }; }, { bytes: w * h * bpp });
      for (const n of [1, 8]) await gpuBench(`upload/${w}x${h}/${fmt}/chunk64x64-x${n}`, () => { const d = mkd(), tx = mkTex(w, h, fmt, d, gl.NEAREST), cols = Math.floor(w / 64), rows = Math.floor(h / 64); prep(tx);
        return k => { d[(k * 97) % d.length] ^= 1; gl.pixelStorei(gl.UNPACK_ROW_LENGTH, w); for (let j = 0; j < n; j++) { const cx = ((k + j) % cols) * 64, cy = (((k + j) / cols | 0) % rows) * 64; gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, cx); gl.pixelStorei(gl.UNPACK_SKIP_ROWS, cy); gl.texSubImage2D(gl.TEXTURE_2D, 0, cx, cy, 64, 64, GF, gl.UNSIGNED_BYTE, d); }
          gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0); gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, 0); gl.pixelStorei(gl.UNPACK_SKIP_ROWS, 0); gl.drawArrays(gl.TRIANGLES, 0, 3); }; }, { bytes: 64 * 64 * bpp * n });
    }
  }

  // 7. whole frame, preset 3: sim and prints on the CPU at 320x180, three R8 uploads, ground in the shader at 640x360, actors and flakes as one instanced draw
  { const atlasD = new Uint8Array(512 * 64 * 4), putA = (x, y, c, a) => { const o = (y * 512 + x) * 4; atlasD[o] = c & 255; atlasD[o + 1] = (c >> 8) & 255; atlasD[o + 2] = (c >> 16) & 255; atlasD[o + 3] = a; };
    for (let d = 0; d < 4; d++) for (let f = 0; f < 4; f++) { const fr = SP24.frames[d][f], ax = (d * 4 + f) * 24; for (let y = 0; y < 32; y++) for (let x = 0; x < 24; x++) { const v = fr[y * 24 + x]; if (v) putA(ax + x, y, pal[v], 255); } }
    putA(1, 33, pal[FLAKE_F], 255); putA(2, 33, pal[FLAKE_F], 255);                                    // 2x1 far flake at (1,33)
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) putA(5 + x, 33 + y, pal[FLAKE], 255);          // 2x2 at (5,33)
    for (const [x, y] of [[10, 33], [9, 34], [10, 34], [11, 34], [10, 35]]) putA(x, y, pal[FLAKE], 255);  // plus at (9,33)
    for (let y = 0; y < 2; y++) for (let x = 0; x < 16; x++) putA(16 + x, 36 + y, 0xff301a14, 110);        // shadow strip at (16,36)
    const atlas = mkTex(512, 64, 'RGBA8', atlasD, gl.NEAREST);
    const env = { gl, PF, PB, setup, bind, mkTex, atlas, fullVAO, batchVAO, instBuf, instData };
    for (const [crowd, upl, flk] of [[0, 'full3', 'quads'], [20, 'full3', 'quads'], [20, 'none', 'quads'], [0, 'full3', 'shader'], [20, 'full3', 'shader'], [20, 'full3', 'none']]) { const info = {};
      await gpuBench(`frame/p3-field1to2-cpu-sim+webgl2-render@640x360/crowd${crowd}-flakes-${flk}${upl === 'none' ? '-no-upload' : ''}`, () => fresh(mkFrameP3)(env, crowd, upl, flk, info), () => ({ actors: 3 + crowd, instances: info.instances, upload_bytes_per_frame: upl === 'full3' ? 172800 : 0, draw_calls: 2 })); }
  }
  return out;
}
