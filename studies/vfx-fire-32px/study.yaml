format: vfx-pixel   # formats.yaml; layout and rules in docs/formats/vfx-pixel.md
kind: recipe
page: vfx-fire-32px-topdown-pixel.html
report: report.md
sandbox:
  page: vfx-fire-32px-sandbox.html
