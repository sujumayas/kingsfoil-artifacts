<body>
<pre id="out">Fire at 32 px benchmark. Call await runCPU({only:'regex'}) or await runGPU({only:'regex'}) from the console or Playwright.</pre>
<script>
"use strict";
// ---------------- harness (copied from studies/vfx-snow-32px/notes/bench/snowbench.html) ----------------

let SINK = 0;

const fresh = f => (0, eval)('/*' + (++FRESH_N) + '*/(' + f.toString() + ')');

// ---------------- 1. DOOM fire buffers ----------------

// ---------------- 2. hand-drawn loops ----------------

// ---------------- 3. burn front at art resolution ----------------

    T(`smoke/${c} px cells (${fw}x${fh})/advect + decay, 1 Uint8 channel fixed point`, () => fresh(mkSmokeB)(fw, fh).step, { cells: fw * fh, bytes: fw * fh * 2 });
    for (const fill of ['plumes', 'noise']) for (const [thr, samp] of [['cluster', 'bil'], ['cluster', 'bilspan'], ['bayer', 'bil'], ['cluster', 'near']]) { let d;
      T(`smoke/${c} px cells (${fw}x${fh})/draw at 640x360, ${fill === 'plumes' ? '30 plumes after 300 ticks' : 'noise-filled stress field'}, ${thr === 'cluster' ? '2x2 cluster threshold' : '4x4 Bayer'}, ${samp === 'bil' ? 'bilinear' : samp === 'bilspan' ? 'bilinear, zero spans skipped' : 'nearest'}`, () => { const F = fresh(mkSmokeB)(fw, fh); for (let i = 0; i < 300; i++) F.step(); if (fill === 'noise') F.fillNoise(); d = fresh(mkSmokeDraw)(A, F, thr, samp); return d; }, () => ({ coverage: d.coverage() })); } }

  // 6. light map
  for (const c of [32, 8, 4]) { let l;
    T(`light/${c} px cells/build from 30 sources`, () => (l = fresh(mkLight)(A, c, 'near')).build, () => ({ cells: l.cells, grid: l.LW + 'x' + l.LH }));
    for (const samp of ['near', 'span', 'bil']) { let m; T(`light/${c} px cells/apply at 640x360, ${samp === 'near' ? 'nearest' : samp === 'span' ? 'nearest, flat runs per cell' : 'bilinear'}, 4x4 Bayer band`, () => { m = fresh(mkLight)(A, c, samp); m.build(); return m.apply; }, () => ({ lit_share: m.lit() })); }
    T(`light/${c} px cells/build + apply nearest`, () => { const m = fresh(mkLight)(A, c, 'near'); return () => { m.build(); m.apply(); }; }); }

  // 7. embers
  for (const n of [256, 512, 1024, 4096]) { T(`embers/${n}/update`, () => fresh(mkEmbers)(A, n, true).update); T(`embers/${n}/draw (mixed 1 px and 2x2)`, () => { const e = fresh(mkEmbers)(A, n, true); e.update(); return e.draw; });
    T(`embers/${n}/update + draw (mixed)`, () => { const e = fresh(mkEmbers)(A, n, true); return () => { e.update(); e.draw(); }; }); }

  // 8. palette pass + putImageData
  for (const B of [A, A3]) { const tag = `${B.W}x${B.H}`;
    T(`palette/${tag}/Uint16 index -> RGBA via Uint32 lookup`, () => fresh(mkPal)(B), { bytes_out: B.NP * 4 });
    for (const accel of [false, true]) T(`palette/${tag}/putImageData + 1 px sync, ${accel ? 'accelerated' : 'software'} canvas`, () => { const cx = accel ? B.cxG : B.cxS; return () => { cx.putImageData(B.img, 0, 0); sync(cx); }; }); }

  // 10. whole frame
  for (const W of [640, 320]) { let fr; T(`frame/default at ${W}x${W * 9 / 16}`, () => (fr = mkFrame(W)), () => ({ layers_ms: layerBreakdown(fr, 600) })); }
  out.info.sink = SINK; return out;
}

// ---------------- GPU run: noise fire shader and texture uploads ----------------
async function runGPU(opts = {}) {
  const only = opts.only ? new RegExp(opts.only) : null, out = { info: {}, results: [] };
  const cv = document.createElement('canvas'); cv.width = 8; cv.height = 8;
  const gl = cv.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
  if (!gl) { out.info.error = 'no webgl2'; return out; }
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  out.info.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); out.info.userAgent = navigator.userAgent;
  const tq = gl.getExtension('EXT_disjoint_timer_query_webgl2'); out.info.timer_query = !!tq;
  out.info.blend = 'on (SRC_ALPHA, ONE_MINUS_SRC_ALPHA, alpha 0.98) so a tile-based GPU cannot drop repeated draws';
  const VS = `#version 300 es
layout(location=0) in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
  // FBM value noise fire: 1 noise unit = 1 tile (32 px), scrolls up 1.5 tiles/s, heat = fbm - height, 5-tone ramp, pixel-snapped to `snap` px
  const FS_FIRE = `#version 300 es
precision highp float;out vec4 o;uniform float tm,snap,oct,tile;uniform vec2 res;uniform vec3 ramp[5];
float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){vec2 q=floor(gl_FragCoord.xy/snap)*snap;vec2 pp=q/tile*vec2(1.,.8)+vec2(0.,-tm*1.5);float f=0.,a=.5;
for(int i=0;i<6;i++){if(float(i)>=oct)break;f+=a*vn(pp);pp=pp*2.03+vec2(1.7,9.2);a*=.5;}
float heat=f*1.4-q.y/res.y*1.1;if(heat<.25)discard;int t=int(clamp((heat-.25)*7.,0.,4.));o=vec4(ramp[t],.98);}`;
  const FS_TEX = `#version 300 es
precision highp float;out vec4 o;uniform sampler2D t0;void main(){o=vec4(texture(t0,vec2(.5)).rgb,.98);}`;
  function compile(vs, fs) { const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const U = new Proxy({}, { get: (o, k) => o[k] ?? (o[k] = gl.getUniformLocation(p, k)) }); return { p, U }; }
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  function mkTex(w, h, fmt, data) { const tx = gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tx); gl.texStorage2D(gl.TEXTURE_2D, 1, fmt === 'R8' ? gl.R8 : gl.RGBA8, w, h);
    if (data) gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, fmt === 'R8' ? gl.RED : gl.RGBA, gl.UNSIGNED_BYTE, data);
    for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, k, gl.NEAREST); return tx; }
  const FBS = {}; function fbo(w, h) { const k = w + 'x' + h; if (FBS[k]) return FBS[k]; const tex = mkTex(w, h, 'RGBA8', null), fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0); return FBS[k] = { fb, tex }; }
  const PFIRE = compile(VS, FS_FIRE), PTEX = compile(VS, FS_TEX);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  const px = new Uint8Array(4);
  function syncGL() { gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
  function timeK(drawOnce, K) { const a = performance.now(); for (let k = 0; k < K; k++) drawOnce(k); syncGL(); return performance.now() - a; }
  async function timerQuery(drawOnce, K) { const q = gl.createQuery(); gl.beginQuery(tq.TIME_ELAPSED_EXT, q); for (let k = 0; k < K; k++) drawOnce(k); gl.endQuery(tq.TIME_ELAPSED_EXT);
    for (let i = 0; i < 4000; i++) { await new Promise(r => setTimeout(r, 0)); if (gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) break; }
    const disjoint = gl.getParameter(tq.GPU_DISJOINT_EXT); const ns = gl.getQueryParameter(q, gl.QUERY_RESULT); gl.deleteQuery(q); return disjoint ? NaN : ns / 1e6; }
  // wall ms per frame = slope between a batch of 1 frame and a batch of K frames, each batch ending in a 1x1 readPixels (copied from the snow bench)
  async function gpuBench(name, mk, extra) { if (only && !only.test(name)) return; let r;
    try { const drawOnce = mk(); for (let i = 0; i < 4; i++) timeK(drawOnce, 3);
      const probe = Math.max(0.001, (timeK(drawOnce, 12) - timeK(drawOnce, 1)) / 11); const K = Math.max(4, Math.min(3000, Math.round(60 / probe)));
      const s1 = [], sK = []; for (let s = 0; s < 21; s++) { s1.push(timeK(drawOnce, 1)); sK.push(timeK(drawOnce, K)); }
      const m1 = stats(s1).median_ms, slopes = sK.map(v => (v - m1) / (K - 1));
      r = Object.assign({ name }, stats(slopes), { K, sync_ms: +m1.toFixed(3) });
      const js = []; for (let s = 0; s < 11; s++) { const a = performance.now(); for (let k = 0; k < K; k++) drawOnce(k); js.push((performance.now() - a) / K); syncGL(); } r.js_ms = stats(js).median_ms;
      if (tq) { const tqs = []; const KT = Math.max(Math.min(K, 400), 20); for (let s = 0; s < 5; s++) tqs.push((await timerQuery(drawOnce, KT)) / KT); const ok = tqs.filter(x => !isNaN(x)); if (ok.length) r.timer_query_ms = +stats(ok).median_ms.toFixed(5); }
      if (typeof extra === 'function') extra = extra(); Object.assign(r, extra || {});
    } catch (e) { r = { name, error: String(e && e.stack || e) }; console.error(name, r.error); }
    out.results.push(r); console.log(name, r.median_ms, r.js_ms, r.timer_query_ms ?? ''); await new Promise(r => setTimeout(r, 0)); }
  const RAMP = new Float32Array([.36, .08, .06, .72, .2, .05, .93, .45, .1, .99, .75, .25, 1, .95, .7]);
  const fire = (RW, RH, vw, vh, snap, oct) => () => { const T = fbo(RW, RH); gl.bindFramebuffer(gl.FRAMEBUFFER, T.fb); gl.viewport(0, 0, vw, vh); gl.useProgram(PFIRE.p);
    gl.uniform1f(PFIRE.U.snap, snap); gl.uniform1f(PFIRE.U.oct, oct); gl.uniform1f(PFIRE.U.tile, RW === 640 ? 32 : 16); gl.uniform2f(PFIRE.U.res, vw, vh); gl.uniform3fv(PFIRE.U.ramp, RAMP); gl.bindVertexArray(vao);
    return k => { gl.uniform1f(PFIRE.U.tm, k / 60); gl.drawArrays(gl.TRIANGLES, 0, 3); }; };
  for (const oct of [3, 5]) await gpuBench(`glfire/640x360 target, full screen, 1 px snap/${oct} octaves`, fire(640, 360, 640, 360, 1, oct), { pixels: 230400 });
  await gpuBench('glfire/640x360 target, full screen, 2 px snap (still one invocation per pixel)/5 octaves', fire(640, 360, 640, 360, 2, 5), { pixels: 230400 });
  await gpuBench('glfire/640x120 band (viewport)/5 octaves', fire(640, 360, 640, 120, 1, 5), { pixels: 76800 });
  await gpuBench('glfire/320x180 target (1:2, upscaled later)/5 octaves', fire(320, 180, 320, 180, 1, 5), { pixels: 57600 });
  await gpuBench('glfire/128x96 house front (viewport)/5 octaves', fire(640, 360, 128, 96, 1, 5), { pixels: 12288 });
  // texSubImage2D upload of a field + a 1 px draw that samples it, so the upload must land
  const prep = tx => { const T = fbo(64, 64); gl.bindFramebuffer(gl.FRAMEBUFFER, T.fb); gl.viewport(0, 0, 1, 1); gl.useProgram(PTEX.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tx); gl.bindVertexArray(vao); };
  await gpuBench('upload/none (1 px draw only)', () => { prep(mkTex(4, 4, 'R8', new Uint8Array(16))); return () => gl.drawArrays(gl.TRIANGLES, 0, 3); }, { bytes: 0 });
  for (const [w, h, fmt] of [[80, 45, 'R8'], [160, 90, 'R8'], [128, 96, 'R8'], [640, 120, 'R8'], [320, 180, 'R8'], [640, 360, 'R8'], [320, 180, 'RGBA8'], [640, 360, 'RGBA8']]) { const bpp = fmt === 'R8' ? 1 : 4, GF = fmt === 'R8' ? gl.RED : gl.RGBA;
    await gpuBench(`upload/${w}x${h} ${fmt}/whole texture`, () => { const d = new Uint8Array(w * h * bpp); for (let i = 0; i < d.length; i++) d[i] = Math.imul(i, 2654435761) >>> 24; const tx = mkTex(w, h, fmt, d); prep(tx);
      return k => { d[(k * 97) % d.length] ^= 1; gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, GF, gl.UNSIGNED_BYTE, d); gl.drawArrays(gl.TRIANGLES, 0, 3); }; }, { bytes: w * h * bpp }); }
  return out;
}
