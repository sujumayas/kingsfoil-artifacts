  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">A flock over the canopy: priority rules, seven neighbours, a wrap box, flaps and shadows</h4><span class="illu">Weights from the study's pseudocode; scale illustrative</span></div>
  <div class="stage"><canvas width="208" height="112" aria-label="A flock of birds with ground shadows; move the pointer to scare them" style="cursor:crosshair"></canvas></div>
  <div class="duo" style="margin-top:8px;align-items:center">
    <div class="stage" style="max-width:260px"><canvas width="40" height="18" aria-label="The drawn flap frames and the true wingbeat wave sampled at 60 fps"></canvas><span class="tagl">frames vs real wingbeat</span></div>
    <div class="ctl col">
      <label class="rng">Wingbeat <input type="range" data-k="hz" min="14" max="27" value="20"><output data-o="hz"></output></label>
      <label class="rng">Flap frames <input type="range" data-k="frames" min="2" max="4" value="2"><output data-o="frames"></output></label>
      <label class="rng">Animation rate <input type="range" data-k="fps" min="8" max="15" value="10"><output data-o="fps"></output></label>
    </div>
  </div>
  <div class="ctl">
    <label class="rng">Birds <input type="range" data-k="n" min="6" max="60" value="30"><output data-o="n"></output></label>
    <div class="seg" data-seg="nb" role="group" aria-label="Neighbours"><button type="button" class="on" data-v="topo">k nearest</button><button type="button" data-v="metric">Radius 40 px</button></div>
    <label class="rng">k <input type="range" data-k="k" min="2" max="12" value="7"><output data-o="k"></output></label>
    <label><input type="checkbox" data-k="prio" checked> Priority-capped</label>
    <label><input type="checkbox" data-k="wrap" checked> Wrap box just off-screen</label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Reynolds ranks the rules (avoid collisions, match velocity, centre on the flock) and allocates acceleration in that order, which beats averaging [V, S220]; untick it to watch averaged rules cancel. Starlings track "a fixed number of 6-7 nearest neighbours" [V, S221, S222]. Birds leaving the box reappear on the far side, the <i>Batman Returns</i> "bat teleportation" [V, S95]. Real wingbeats are 14–27 Hz, too fast to show, so draw 2–4 frames at 8–15 fps [V, S223; I]. Each shadow sits at the bird's ground point and fades with height [I]. Move the pointer over the flock to scare it.</figcaption>
</figure>

        <div class="seg" data-seg="seasons" role="group" aria-label="Seasons"><button type="button" class="on" data-v="lut">Seasons by LUT</button><button type="button" data-v="sheets">4 season sheets</button></div>

  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>The arithmetic is the table's: 480×270 internal resolution, 16 px tiles, ≈ 550–1,770 items on screen; a target of fewer than 1,500 tree sprites and 50 draw calls; trunks + canopy + shadows + ~9 undergrowth chunks + particles + birds ≈ 15–30 calls with characters and UI; 128 B of instance data per item in a 16,384-item buffer (2 MB, triple-buffered); 1024² atlas 4 MB, 2048² 16 MB; 256 KB per baked chunk; the Sandbox's 288 sprites ≈ 0.84 MB, or one season's ≈ 52k px plus a ≈ 3 KB LUT [I, note 02; I, note 08; V, S100]. The CPU ceilings are the community Bunnymark figures, ~5k script-moved sprites on a laptop and 2k on an old phone [V, community, S126]. None of this has been measured in Godot yet [I].</figcaption>
</figure>
