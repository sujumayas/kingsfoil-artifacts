<figure class="fig" data-demo="pvp" id="fig-pvp">

  <div style="max-width:680px;"><div class="stage"><canvas width="170" height="104" aria-label="On the left a knight hits a goblin, which freezes, flinches and is pushed back. On the right the same knight hits an enemy player, who keeps walking. Below, a timeline shows each stun on the player shrinking from 100 percent to 50 percent to immune"></canvas><div class="hud" data-hud></div></div></div>
  <div class="ctl">
    <button type="button" class="btn warm" data-b="hit">Hit both</button><button type="button" class="btn ghost" data-b="stun">Stun the player</button><button type="button" class="btn ghost" data-b="kb">Knock back</button>
  </div>
  <div class="ctl">
    <div class="seg" data-seg="view" role="group" aria-label="Whose screen"><button type="button" class="on" data-v="att">Attacker</button><button type="button" data-v="vic">Victim</button></div>
    <label><input type="checkbox" data-k="fast"> Time 4x</label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Hit both, then stun the player three times. WoW's rule since 12.1.0 is 100%, then 50%, then immune, with a 20 s reset and a 6 s cap in PvP [V, S121]. A knockback makes a player immune to knockbacks for 10 s, while the goblin takes every push [V, S121; I, note 04]. TFS halves player damage, so the player takes 10 where the goblin takes 20 [V, S23]. The goblin freezes and flinches, the player keeps walking with a 1 px flinch, and only the local player's camera shakes [I]. Switch to the victim's screen to see that the player hit still steers.</figcaption>
</figure>

<!--FIG voices-->
<figure class="fig" data-demo="voices" id="fig-voices">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Sixteen voices, three per sound, and your own hits never cut</h4><span class="illu">Hit mix and synth settings are illustrative, within jsfxr's ranges</span></div>
  <div style="max-width:680px;"><div class="stage"><canvas width="170" height="104" aria-label="Sixteen voice slots fill with coloured bars as hit sounds play and drain as they end. A white flash marks a stolen voice. Below, the last two seconds of triggers are plotted by priority: dots played, small rings stolen, red crosses dropped"></canvas><div class="hud" data-hud></div></div></div>
  <div class="ctl">
    <button type="button" class="btn ghost" data-b="snd" aria-pressed="false">Sound off</button>
    <button type="button" class="btn warm" data-b="own">My hit</button>
    <label><input type="checkbox" data-k="pool" checked> Pool limits</label>
  </div>
  <div class="ctl">
    <label class="rng">Hits per second <input type="range" min="1" max="128" step="1" value="24" data-k="hps"><output data-o="hps">24 /s</output></label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Turn the sound on and push the rate. A pool of 16, at most 3 voices per sound and 40 ms between starts of one sound keep the mix clear, and a full pool steals from the lowest priority. The order is own hit, hit on you, crit or kill involving you, others, ambient [I, notes 07 and 09]. FMOD never lets a lower priority steal a higher one [V, S164]. Each hit is synthesized in jsfxr's hitHurt ranges, square, saw or noise at 145 to 2260 Hz with a downward slide and a decay under 204 ms, pitched ±1 semitone except crits [V, S168; I, note 07]. Turn off the limits at 128 hits per second to hear the mud. Each Web Audio voice cost about 0.1% of an M4 core [V, S4].</figcaption>
</figure>

<!--FIG critstack-->
<figure class="fig" data-demo="critstack" id="fig-critstack">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Which layers carry a crit, and who should feel each one</h4><span class="illu">Damage values are illustrative</span></div>
  <div style="max-width:680px;"><div class="stage"><canvas width="170" height="96" aria-label="A blue knight strikes a red enemy knight. Normal hits show a small red number and a spark. Crits add big yellow digits that pop, a longer freeze, a white flash, a camera kick and more sparks. Overkill ends in a bigger death pop"></canvas><div class="hud" data-hud></div></div></div>
  <div class="ctl">
    <button type="button" class="btn ghost" data-b="norm">Normal hit</button><button type="button" class="btn warm" data-b="crit">Crit</button><button type="button" class="btn ghost" data-b="over">Overkill</button>
    <button type="button" class="btn ghost" data-b="snd" aria-pressed="false">Sound off</button>
  </div>
  <div class="ctl">
    <label><input type="checkbox" data-k="num" checked> Number</label>
    <label><input type="checkbox" data-k="stop" checked> Hitstop</label>
    <label><input type="checkbox" data-k="flash" checked> Flash</label>
    <label><input type="checkbox" data-k="kick" checked> Kick</label>
    <label><input type="checkbox" data-k="snd" checked> Sound</label>
    <label><input type="checkbox" data-k="sparks" checked> Sparks</label>
  </div>
  <div class="ctl">
    <div class="seg" data-seg="view" role="group" aria-label="Whose screen"><button type="button" class="on" data-v="att">Attacker</button><button type="button" data-v="vic">Victim</button><button type="button" data-v="by">Bystander</button></div>
    <label><input type="checkbox" data-k="slow"> 0.25x speed</label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Switch layers off one at a time and press Crit. Asterion's crit stacks bigger yellow digits with a 2x pop for 3 frames, 6 frames of hitstop instead of 3, trauma +0.3 with a 2 px kick away from the target, and a crit sound [I, note 07]. Most of it belongs to the attacker and the victim. Tibia sends the crit effect to every spectator and the "critical attack" text only to the attacker, so a bystander sees the impact sprite and hears the sound at −12 dB [V, S31; I, note 07]. Crit shake on every client is the classic MMO mistake. Overkill shows only as a bigger death pop [I, note 07].</figcaption>
</figure>

<!--FIG death-->
<figure class="fig" data-demo="death" id="fig-death">
  <div class="fig-h"><span class="fig-n">Fig. @N</span><h4 class="fig-t">Kill, pop, corpse in 133 ms, then rot in stages</h4><span class="illu">Rot shown much faster than real time</span></div>
  <div style="max-width:680px;"><div class="stage"><canvas width="170" height="100" aria-label="A knight kills goblins one after another. Each goblin flashes white for two frames, squashes wide and dissolves in a dither pattern, and a corpse appears that turns from fresh to rotting with flies to bones. A strip below shows the nine frames of the death"></canvas><div class="hud" data-hud></div></div></div>
  <div class="ctl">
    <button type="button" class="btn warm" data-b="kill">Kill</button>
    <div class="seg" data-seg="ts" role="group" aria-label="Rot speed"><button type="button" data-v="1">1x</button><button type="button" class="on" data-v="20">20x</button><button type="button" data-v="60">60x</button></div>
    <button type="button" class="btn ghost" data-b="snd" aria-pressed="false">Sound off</button>
  </div>
  <div class="ctl">
    <label><input type="checkbox" data-k="tibia"> Tibia style (instant corpse)</label>
    <label><input type="checkbox" data-k="slow"> 0.25x speed</label>
  </div>
  <div class="readout" data-ro aria-live="polite"></div>
  <figcaption>Press Kill. Everyone sees 2 white frames, a squash to 1.2 by 0.8 with a dither fade, and the corpse at about 133 ms, the 8 frames in the strip [I, note 07]. Only the killer gets the kill blip and "+120 xp" rising 16 px over 800 ms. Players spam-click corpses, so any longer animation before loot feels like lag [I, note 07]. Tibia has no death animation at all and drops a splash and the corpse at once, which the toggle shows [V, S25, S26]. Corpses rot 120 + 120 + 30 s in Asterion's plan, against 300 + 300 + 60 s for Canary's rat [V, S33; I, note 07].</figcaption>
</figure>
