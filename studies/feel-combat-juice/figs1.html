  <figcaption>Asterion merges hits per target, tier and damage type inside 400 ms, keeps crits apart, and caps numbers at 4 per target and 64 on screen, dropping the oldest <span class="cite"><b class="tag ti">I</b> note 05</span>. Old School RuneScape keeps 4 hitsplat slots per actor <span class="cite"><b class="tag tv">V</b> S38, S39</span>. Turn both boxes off and push the rate up. The numbers turn into a wall, and the cost readout climbs with them, because each glyph is one blit. In our benchmark, folding 1000 live numbers into 100 cut the glyph-blit cost from 3.38 to 0.94 ms on the M4 GPU and from 13.18 to 4.18 ms under a 6x CPU throttle <span class="cite"><b class="tag tv">V</b> S4</span>.</figcaption>
</figure>
