  <div class="ctl">

  <figcaption><b>Click or drag to spill.</b> Each wet cell sends a share of its surface height (acid + floor) to lower 4-neighbours, never more than 90 % of what it holds (<code>k = min(0.2, a·0.9/s)</code>), double-buffered. A cell thinner than <code>FILM</code> cannot wet a dry neighbour, so the outline freezes; drag FILM to 0 and the same spill smears forever. Grout sits lower than tiles and a trench runs to the right wall, so acid creeps into the grid and pools in the drain. With evaporation off the counter shows that flow is exactly conservative.</figcaption>

<!--/FIG-->

<!--FIG pipes-->
<figure class="fig" data-demo="pipes" id="fig-6">
  <div class="fig-h"><span class="fig-n">Fig. 6</span><h4 class="fig-t">Level grid vs virtual pipes: diamonds or sloshing</h4><span class="illu">Toy constants</span></div>
  <div class="pair">
    <div><div class="stage"><canvas width="96" height="64" aria-label="Integer level grid flow"></canvas><span class="tagl">Level grid, 0–7</span></div>
      <p class="pl">Each source block (4×4 px cells here) spreads <code>level − 1</code> to its 4-neighbours, as in Minecraft's 0–7 levels; the last three drops stay as sources. Equalising by <code>/4</code> on a square grid makes <b>diamonds</b>.</p></div>
    <div><div class="stage"><canvas width="96" height="64" aria-label="Virtual pipes flow with momentum"></canvas><span class="tagl">Virtual pipes</span><div class="hud" data-hud></div></div>
      <p class="pl">Each edge stores a flux: <code>f = max(0, f + Δt·g·Δh)</code>, outflows scaled by <code>K = min(1, d/(Σf·Δt))</code>, then <code>d += Δt·(in − out)</code>. Flux has memory, so the liquid <b>sloshes</b>.</p></div>
  </div>
  <div class="ctl">
    <button type="button" class="btn" data-b="drop">Drop a column on both</button>
    <label class="rng">Pipe friction <input type="range" data-k="fr" min="0" max="0.2" step="0.005" value="0.02"><output data-o="fr"></output></label>
    <label><input type="checkbox" data-k="bowl" checked> Sloped bowl floor</label>
  </div>
  <figcaption>Click either panel to drop acid on both at the same spot. Virtual pipes (Mei, Decaudin and Hu 2007, after O'Brien and Hodgins 1995) are the upgrade when you want waves. lisyarus damps the stored flow with <code>(1 − friction)^dt</code>; set friction near 0 to watch it ring. Pipes are a gather rule, so they port to fragment shaders; Jákó measured them at 25.7 ms on CPU vs 0.295 ms on GPU at 128².</figcaption>
</figure>
<!--/FIG-->

    <div class="seg" data-seg="mat" role="group" aria-label="Material"><button type="button" data-v="3">Wood</button><button type="button" class="on" data-v="4">Iron</button><button type="button" data-v="5">Bone</button><button type="button" data-v="7">Cloth</button><button type="button" data-v="8">Gold</button></div>

<!--FIG stack-->
<figure class="fig" data-demo="stack" id="fig-26">
  <div class="fig-h"><span class="fig-n">Fig. 26</span><h4 class="fig-t">The layered architecture, server to pixels</h4><span class="illu">Design proposal [I]</span></div>
  <div class="stack">
    <div class="layers">
      <button type="button" class="layer srv" data-l="L-server"><b>0</b><span>Server gameplay<small>tile acid level, items, stacks, gas</small></span></button>
      <div class="layer-arrow">▼ tile events + seeds</div>
      <button type="button" class="layer" data-l="L-data"><b>1</b><span>Data layer<small>8-bit textures per visible chunk</small></span></button>
      <div class="layer-arrow">▼</div>
      <button type="button" class="layer" data-l="L-cpu"><b>2</b><span>CPU update<small>scatter rules, dirty boxes</small></span></button>
      <button type="button" class="layer" data-l="L-gpu"><b>2′</b><span>GPU update (Godot 4.7)<small>gather rules via DrawableTexture2D</small></span></button>
      <div class="layer-arrow">▼</div>
      <button type="button" class="layer" data-l="L-render"><b>3</b><span>Render layer<small>one CanvasItem shader per layer</small></span></button>
      <div class="layer-arrow">▼</div>
      <button type="button" class="layer" data-l="L-slime"><b>4</b><span>Slimes<small>CanvasGroup threshold</small></span></button>
    </div>
    <div class="ldet" aria-live="polite"></div>
  </div>
  <template id="L-server"><h4>Server gameplay (authoritative)</h4><ul><li>Per-tile acid level 0–3 + liquid enum + flags (Into the Breach / CDDA style), 1–2 B per tile</li><li>Item stages 0–3 (the server owns them; the client owns the look)</li><li>Corrosion stacks (C3) and per-tile gas at turn rate (SPD rule)</li></ul><p>Clients receive tile events and seeds and run the pixel simulation as cosmetic, allowed to diverge. Never sync per-pixel acid.</p></template>
  <template id="L-data"><h4>Data layer (client)</h4><ul><li>Acid amount (+ concentration): R8 or RG8, 1 cell per 4 px (4×4 per 16-px tile), or per pixel near the camera</li><li>Integrity: R8 per object sprite; per pixel only for world objects (doors, bars, crates)</li><li>Stain / salt / rust: R8 each, or packed RGBA8</li><li>Fumes: R8 at half or quarter resolution (Sandbox: 160×90)</li></ul><p>Compatibility is RGBA8 for colour precision and float formats on WebGL 2 are unconfirmed, so stay 8-bit.</p></template>
  <template id="L-cpu"><h4>CPU path</h4><p><code>PackedByteArray</code> per active chunk with dirty bounding boxes; liquid at 10–15 Hz, corrosion 2–5 Hz, gas 4–10 Hz, stain fade 0.2 Hz; upload with <code>ImageTexture.update()</code>.</p><p>This handles the <b>scatter</b> rules: moves, random consumption, corrosion fronts.</p></template>
  <template id="L-gpu"><h4>GPU path (optional, experimental)</h4><p><code>DrawableTexture2D.blit_rect()</code> with <code>texture_blit</code> shaders, up to 4 inputs and outputs per blit, for <b>gather</b> rules only: diffusion, fumes, stain decay. ProfesorShader's CC0 flow sim shows the ping-pong pattern.</p><p>No compute shaders, no RenderingDevice, no particle trails or SDF collision on Compatibility. Wrap the API in one script.</p></template>
  <template id="L-render"><h4>Render layer</h4><p>One CanvasItem shader per layer: palette-index lookup through a LUT, a Bayer threshold for acid edges and stage changes, stage ramps per material, fume haze as a palette variant. Canvas shaders can read <code>texture_sdf</code> for distance to walls if walls have LightOccluder2D.</p></template>
  <template id="L-slime"><h4>Slimes</h4><p>Soft radial sprites inside a CanvasGroup, thresholded in the group's shader (<code>step(0.5, a)</code>) and quantised to 2–3 tones. To merge with puddles, the group shader also samples the acid texture. CanvasGroup threshold docs were not checked [U].</p></template>
  <figcaption>Click a layer to see what it holds. Everything here is a design proposal grounded in the cited sources; none of it has been tested in Godot.</figcaption>
</figure>
<!--/FIG-->
