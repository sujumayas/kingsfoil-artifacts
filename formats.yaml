# Study formats: the registered page structures a study can use.
# A format fixes how a study is built: which recipe it is cloned from, whether it has a sandbox,
# how its pages are named and which report layout its recipe parses.
# How to choose one, and how to add a new one: docs/FORMATS.md. The validator checks every study against this file.
#
# status:   active  = use for new studies; `template` is a shipped recipe study of this format
#           draft   = being created by its first study; scaffolds clone `base`; promote to active once that study ships
#           legacy  = existing pages only; `studies` lists them; never used for new studies
# sandbox:  required | optional | none
# page / sandbox_page: name patterns, {id} = the study id

formats:
  vfx-pixel:
    status: active
    title: Tiny VFX study with a playable sandbox
    use_for: One visual effect or rendering concept for top-down pixel art, researched as a family of small
      old-school algorithms, with a 320x180 canvas sandbox (640x360 for studies at 32 px tile scale) that
      plays the recommended architecture.
    template: vfx-light
    sandbox: required
    page: "{id}-topdown-pixel.html"
    sandbox_page: "{id}-sandbox.html"
    doc: docs/formats/vfx-pixel.md

  legacy-static:
    status: legacy
    title: Static page whose build pipeline was lost
    use_for: The two studies built before the repo existed. Edit their pages in place.
    studies: [ai-rts-enemy, procgen-characters]
    sandbox: none

  design-curves:
    status: active
    title: Difficulty and learning curve study for one Kingsfoil game
    use_for: One Kingsfoil game's difficulty and learning curves, researched through structural twins, pattern
      lineages and natural experiments, ending in a Curve Spec, a playtest protocol and a ranked backlog.
      Optional curve lab sandbox that plots the spec.
    template: curves-hearthguard
    sandbox: optional
    page: "{id}.html"
    sandbox_page: "{id}-lab.html"
    doc: docs/formats/design-curves.md

  feel-pixel:
    status: active
    title: Game-feel study of one player interaction, with a playable sandbox
    use_for: One player interaction in a top-down pixel MMORPG (talking to NPCs, combat hits, looting),
      researched as families of techniques for feel, art, systems and cost, with a 320x180 canvas sandbox
      the reader plays to compare the options.
    template: feel-npc-dialog
    sandbox: required
    page: "{id}-topdown-pixel.html"
    sandbox_page: "{id}-sandbox.html"
    doc: docs/formats/feel-pixel.md

  mechanics-playable:
    status: active
    title: Mechanics study of one Kingsfoil game, with a playable sandbox
    use_for: The whole mechanical kit of one Kingsfoil game (movement, animation, elements, enemies, map design,
      difficulty curve, social loops), researched as families of techniques from the games that did it best,
      with a playable canvas sandbox the reader plays to feel each technique on and off.
    template: mechanics-speedrunner
    sandbox: required
    page: "{id}.html"
    sandbox_page: "{id}-sandbox.html"
    doc: docs/formats/mechanics-playable.md
